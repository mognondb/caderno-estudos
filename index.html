async function baixarAgenda(){
  const hr=cfg().horarios||{};
  if(!Object.values(hr).some(Boolean)){toast("Defina e salve pelo menos um horário de estudo antes.");return}
  const semanas=Number(($("ag-sem")||{}).value)||12,ws0=mondayOf(new Date()),f12=m=>{const h=Math.floor(m/60)%24,mm=m%60;return ((h%12)||12)+":"+pad(mm)+" "+(h>=12?"PM":"AM")};
  const fUS=d=>pad(d.getMonth()+1)+"/"+pad(d.getDate())+"/"+d.getFullYear(),cel=v=>{v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[["Subject","Start Date","Start Time","End Date","End Time","All Day Event","Description","Private"]];
  for(let w=0;w<semanas;w++){
    const ws=addDays(ws0,7*w),N=weekIndex(ws);
    DIAS.forEach((d,k)=>{
      const date=addDays(ws,k),h0=hr[d.i];if(!h0)return;
      const p=h0.split(":").map(Number);let cur=p[0]*60+(p[1]||0);
      const itens=(slotsPadrao()[d.i]||[]).map(s=>({t:resolveTrilha(s.trilha,N),min:Number(s.min)||0}));
      S.livros.filter(b=>b.extraData===iso(date)).forEach(b=>itens.push({extra:b,min:Number(b.extraMin)||60}));
      itens.forEach(it=>{
        let assunto,desc="";
        if(it.extra){assunto="Estudo: "+it.extra.titulo;desc=[it.extra.autor,it.extra.foco].filter(Boolean).join(" — ")}
        else if(it.t==="sintese"){assunto="Estudo: síntese escrita";desc="Escrever 1 a 2 páginas sobre o que leu no mês."}
        else if(topicosDe(it.t).length){const at=topicosAtivos(it.t);assunto="Estudo: "+T(it.t).curto+(at.length?" — "+at.map(x=>x.nome).join(" + "):"")}
        else{const a=emLeitura(it.t);assunto="Estudo: "+T(it.t).curto+(a.lendo[0]?" — "+a.lendo[0].titulo:"");desc=a.lendo.map(b=>b.titulo+(b.foco?" ("+b.foco+")":"")).join("; ")}
        rows.push([assunto,fUS(date),f12(cur),fUS(date),f12(cur+it.min),"False",desc,"True"]);cur+=it.min;
      });
    });
  }
  if(rows.length<2){toast("Nenhum bloco nos dias com horário definido.");return}
  if(await baixar("agenda-estudos.csv",rows.map(r=>r.map(cel).join(",")).join("\r\n")))toast("Agenda baixada: "+plural(rows.length-1,"bloco","blocos")+".");
}

const PDFJS_BASE="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfjsPronto=null;
function carregarScript(src){return new Promise((ok,falha)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>falha(new Error("load"));document.head.appendChild(s)})}
function carregarPdfjs(){
  if(!pdfjsPronto)pdfjsPronto=carregarScript(PDFJS_BASE+"pdf.worker.min.js").then(()=>carregarScript(PDFJS_BASE+"pdf.min.js")).then(()=>{const L=window.pdfjsLib||window["pdfjs-dist/build/pdf"];L.GlobalWorkerOptions.workerSrc=PDFJS_BASE+"pdf.worker.min.js";return L}).catch(e=>{pdfjsPronto=null;throw e});
  return pdfjsPronto;
}
function pedirPdf(alvo){
  if(!S.assets){toast("Importar arquivos não está disponível agora. Recarregue a página.");return}
  S.pdfTarget=alvo;const inp=$("pdf-input");inp.value="";inp.click();

async function importarPdf(file){
  const alvo=S.pdfTarget;S.pdfTarget=null;if(!file||!alvo)return;
  if(!/pdf$/i.test(file.type)&&!/\.pdf$/i.test(file.name)){toast("Escolha um arquivo PDF.");return}
  if(file.size>20*1024*1024){toast("O PDF passa de 20 MB, o limite por arquivo. Use um arquivo menor ou dividido em partes.");return}
  toast("Enviando o PDF…");
  let r;
  try{r=await S.assets.upload(file,{type:"application/pdf"})}
  catch(e){const c=e&&e.code;toast(c==="too_large"?"O PDF passa do limite de 20 MB.":c==="unsupported_type"?"Esse arquivo não parece ser um PDF válido.":c==="quota_or_state"?"O espaço de arquivos do caderno acabou. Exclua textos com PDF que não usa mais.":"Não foi possível enviar o PDF. Tente de novo.");return}
  try{
    if(alvo.artigo){const a=artigo(alvo.artigo);if(!a)return;await save("artigos/"+a.id,{...strip(a),pdfId:r.id,pdfNome:file.name});toast("PDF anexado à matéria.");abrirLeitor(a.id,r.id)}
    else if(alvo.livro){const b=livro(alvo.livro);if(!b)return;await save("livros/"+b.id,{...strip(b),pdfId:r.id,pdfNome:file.name});toast("PDF anexado.");abrirLeitor(b.id,r.id)}
    else if(alvo.topico){
      const tp=topico(alvo.topico);if(!tp)return;
      const lendo=S.livros.some(x=>x.topicoId===tp.id&&x.status==="lendo");
      await save("livros/"+novoId("livros"),{titulo:file.name.replace(/\.pdf$/i,""),autor:"",trilha:topTrilha(tp),etapa:etapaAtual(),mes:null,status:lendo?"fila":"lendo",tipo:"principal",foco:"",topicoId:tp.id,pdfId:r.id,pdfNome:file.name,ordem:Math.max(0,...S.livros.map(x=>Number(x.ordem)||0))+10,paginasLidas:null,paginasTotal:null});
      toast("PDF importado para o tópico. Para mudar o título, use ⋯ › Editar.");
    }
  }catch(e){}
}

function aplicarZoom(){

  pages.style.width=(R.zoom===1?"min(880px,100%)":(R.zoom*100)+"%");pages.style.maxWidth=R.zoom===1?"880px":"none";

async function abrirLeitor(livroId,pdfIdForcado){
  const it=itemDeLeitura(livroId),b=it&&it.x,pdfId=pdfIdForcado||(b&&b.pdfId);
  if(!pdfId){toast("Este texto não tem PDF.");return}
  fecharLeitor();
  Object.assign(R,{livroId,pdfId,tool:"ler",cor:"amarelo",pages:[],anot:{},cur:1,maxVisto:1,pdf:null,drag:null,zoom:1});
  $("reader-root").innerHTML=barraLeitor(b);document.body.classList.add("reading");
  const falhar=msg=>{if(R.livroId===livroId)$("rd-pages").innerHTML='<div class="empty">'+msg+'</div>'};
  let L;try{L=await carregarPdfjs()}catch(e){falhar("Não foi possível carregar o leitor de PDF. Verifique a conexão e tente de novo.");return}
  try{
    let buf;
    if(S.assets&&S.assets.baixar)buf=await S.assets.baixar(pdfId);
    else{const resp=await fetch("/_blob/"+pdfId);if(!resp.ok)throw new Error("http "+resp.status);buf=await resp.arrayBuffer()}if(R.livroId!==livroId)return;
    R.pdf=await L.getDocument({data:new Uint8Array(buf)}).promise;
  }catch(e){falhar("Não foi possível abrir este PDF. O arquivo pode ter sido removido ou estar corrompido.");return}
  if(R.livroId!==livroId)return;
  const v1=(await R.pdf.getPage(1)).getViewport({scale:1}),cont=$("rd-pages");cont.innerHTML="";
  for(let n=1;n<=R.pdf.numPages;n++){
    const el=document.createElement("div");el.className="pg";el.dataset.n=n;el.style.aspectRatio=v1.width+" / "+v1.height;
    el.innerHTML='<canvas></canvas><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+v1.width+' '+v1.height+'" preserveAspectRatio="none"></svg><span class="pgnum">'+n+'</span>';
    cont.appendChild(el);R.pages.push({n,el,canvas:el.querySelector("canvas"),svg:el.querySelector("svg"),w:v1.width,h:v1.height,pronta:false,desenhando:false});
  }
  aplicarZoom();
  const sc=$("rd-scroll");
  R.obs=new IntersectionObserver(ents=>ents.forEach(en=>{const pg=R.pages[Number(en.target.dataset.n)-1];if(!pg)return;if(en.isIntersecting)desenharPagina(pg);else desenharPaginaVazia(pg)}),{root:sc,rootMargin:"1200px 0px"});
  R.pages.forEach(pg=>R.obs.observe(pg.el));
  sc.addEventListener("scroll",()=>{if(R.raf)return;R.raf=requestAnimationFrame(()=>{R.raf=0;acompanharPagina()})});
  if(S.db)R.unsub=S.db.collection("anot").where("livroId","==",livroId).onSnapshot(snap=>{
    if(R.livroId!==livroId||R.drag)return;R.anot={};snap.docs.forEach(d=>{const x=d.data();R.anot[x.pagina]=x.itens||[]});

  },()=>{});

async function desenharPagina(pg){
  if(pg.pronta||pg.desenhando||!R.pdf)return;pg.desenhando=true;
  try{
    const page=await R.pdf.getPage(pg.n),base=page.getViewport({scale:1});
    if(Math.abs(base.width-pg.w)>0.5||Math.abs(base.height-pg.h)>0.5){pg.w=base.width;pg.h=base.height;pg.el.style.aspectRatio=pg.w+" / "+pg.h;pg.svg.setAttribute("viewBox","0 0 "+pg.w+" "+pg.h);desenharMarcas(pg.n)}
    const vp=page.getViewport({scale:(pg.el.clientWidth||800)/base.width*Math.min(window.devicePixelRatio||1,2)});
    pg.canvas.width=Math.floor(vp.width);pg.canvas.height=Math.floor(vp.height);
    pg.task=page.render({canvasContext:pg.canvas.getContext("2d"),viewport:vp});await pg.task.promise;pg.pronta=true;
  }catch(e){}finally{pg.desenhando=false;pg.task=null}
}
function desenharPaginaVazia(pg){if(pg.task){try{pg.task.cancel()}catch(e){}}pg.canvas.width=0;pg.canvas.height=0;pg.pronta=false}
function acompanharPagina(){

  for(const pg of R.pages){if(pg.el.offsetTop<=meio)cur=pg.n;else break}

}

function ligarPonteiroDoLeitor(){
  const root=$("reader-root");
  root.addEventListener("pointerdown",e=>{
    if(!R.livroId||R.tool==="ler")return;
    const svg=e.target.closest(".pg svg");if(!svg)return;

    e.preventDefault();const p=pontoNaPagina(pg,e);
    if(R.tool==="nota"){dialogoNotaPdf(pg.n,null,p[0],p[1]);return}
    svg.setPointerCapture(e.pointerId);
    const ns="http://www.w3.org/2000/svg",c=CORES_AN[R.cor];
    if(R.tool==="marca"){const el=document.createElementNS(ns,"rect");el.setAttribute("fill",c);el.setAttribute("fill-opacity","0.35");svg.appendChild(el);R.drag={pg,x0:p[0],y0:p[1],el}}
    if(R.tool==="caneta"){const el=document.createElementNS(ns,"polyline");["fill:none","stroke:"+c,"stroke-width:2","stroke-linecap:round","stroke-linejoin:round"].forEach(kv=>{const [k,v]=kv.split(":");el.setAttribute(k,v)});svg.appendChild(el);R.drag={pg,pts:[p],el};el.setAttribute("points",p.join(","))}
  });
  root.addEventListener("pointermove",e=>{
    const d=R.drag;if(!d)return;const p=pontoNaPagina(d.pg,e);
    if(R.tool==="marca"){d.el.setAttribute("x",Math.min(d.x0,p[0]));d.el.setAttribute("y",Math.min(d.y0,p[1]));d.el.setAttribute("width",Math.abs(p[0]-d.x0));d.el.setAttribute("height",Math.abs(p[1]-d.y0))}
    if(R.tool==="caneta"){const l=d.pts[d.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>=1.5){d.pts.push(p);d.el.setAttribute("points",d.pts.map(q=>q.join(",")).join(" "))}}
  });
  const fim=e=>{
    const d=R.drag;if(!d)return;R.drag=null;d.el.remove();
    if(R.tool==="marca"){const p=pontoNaPagina(d.pg,e),w=Math.abs(p[0]-d.x0),h=Math.abs(p[1]-d.y0);if(w>3&&h>3)addMarca(d.pg.n,{tipo:"marca",x:arred(Math.min(d.x0,p[0])),y:arred(Math.min(d.y0,p[1])),w:arred(w),h:arred(h),cor:R.cor})}
    if(R.tool==="caneta"&&d.pts.length>1)addMarca(d.pg.n,{tipo:"traco",pts:d.pts,cor:R.cor});
  };
  root.addEventListener("pointerup",fim);root.addEventListener("pointercancel",fim);
  root.addEventListener("click",e=>{if(!R.livroId||R.tool!=="ler")return;const pin=e.target.closest(".pin");if(!pin)return;dialogoNotaPdf(Number(pin.closest(".pg").dataset.n),Number(pin.dataset.i))});
}

function opcoesDoCronometro(){
  const hoje=new Date(),N=weekIndex(mondayOf(hoje)),d=DIAS.find(x=>x.i===hoje.getDay()),bl=blocosDoDia(d,hoje,N),w=wk(),op=[];
  bl.extras.forEach(b=>op.push({rotulo:b.titulo,trilha:b.trilha,livroId:b.id,topicoId:b.topicoId||""}));
  bl.slots.forEach(s=>{
    const key=d.i+":"+s.id,t=resolveTrilha(s.trilha,N),tb=(w.trocas||{})[key]&&livro(w.trocas[key]);
    if(tb)return op.push({rotulo:T(tb.trilha).curto+" — "+tb.titulo,trilha:tb.trilha,livroId:tb.id,topicoId:tb.topicoId||""});
    if(t==="sintese")return op.push({rotulo:"Síntese escrita",trilha:"sintese",livroId:"",topicoId:""});
    if(topicosDe(t).length){const at=topicosAtivos(t);return op.push({rotulo:T(t).curto+(at.length?" — "+at.map(x=>x.nome).join(" + "):""),trilha:t,livroId:"",topicoId:at.length===1?at[0].id:""})}
    const a=emLeitura(t);op.push({rotulo:T(t).curto+(a.lendo[0]?" — "+a.lendo[0].titulo:""),trilha:t,livroId:a.lendo[0]?a.lendo[0].id:"",topicoId:""});
  });
  op.push({rotulo:"Outro estudo",trilha:"",livroId:"",topicoId:""});
  return op;
}
function minutosDaSessao(){return Math.round((TM.foco*60000-Math.max(0,tmResto()))/60000)}

  if(!S.db||S.readOnly||!TM.alvo||min<1)return;

  save("sessoes/"+novoId("sessoes"),{data:iso(agora),inicio:new Date(agora.getTime()-min*60000).toISOString(),minutos:min,trilha:a.trilha||"",livroId:a.livroId||"",topicoId:a.topicoId||"",rotulo:a.rotulo||""}).catch(()=>{});

function minutosCronometrados(ws){const ini=iso(ws),fim=iso(addDays(ws,6));return S.sessoes.filter(x=>x.data>=ini&&x.data<=fim).reduce((s,x)=>s+(Number(x.minutos)||0),0)}
function planejadoDaSemana(ws,doc){
  const slots=(doc&&doc.slots)||slotsPadrao(),feitos=(doc&&doc.feitos)||{};let plano=0,feito=0;
  DIAS.forEach((d,k)=>{
    (slots[d.i]||[]).forEach(s=>{const m=Number(s.min)||0;plano+=m;if(feitos[d.i+":"+s.id])feito+=m});
    S.livros.filter(b=>b.extraData===iso(addDays(ws,k))).forEach(b=>{const m=Number(b.extraMin)||60;plano+=m;if(feitos["x:"+b.id])feito+=m});
  });
  return {plano,feito};
}
async function carregarSemanas(){

function telaHistorico(){
  if(!S.semanasCache){S.semanasCache={};carregarSemanas()}
  const atual=mondayOf(new Date()),semanas=[];
  for(let k=7;k>=0;k--){const ws=addDays(atual,-7*k),doc=iso(ws)===iso(S.weekStart||atual)?S.semanaDoc:S.semanasCache[iso(ws)];semanas.push({ws,crono:minutosCronometrados(ws),...planejadoDaSemana(ws,doc)})}
  const maxv=Math.max(60,...semanas.map(s=>Math.max(s.plano,s.crono)));
  let h='<div class="spread"><div><h2>Histórico de estudo</h2><p class="small muted">Tempo registrado (cronômetro e leituras fora do horário), comparado com o planejado de cada semana.</p></div><button class="btn primary" data-act="sessao-nova"'+dis()+'>+ Registrar sessão</button></div>';
  h+='<section class="card"><h3>Últimas 8 semanas</h3><div class="hist">'+semanas.map(s=>{
    const pc=Math.round(s.crono/maxv*100),pp=Math.round(s.plano/maxv*100),eAtual=iso(s.ws)===iso(atual);
    const dica=fmtDM(s.ws)+": "+fmtHM(s.crono)+" registradas de "+fmtHM(s.plano)+" planejadas; blocos marcados como feitos: "+fmtHM(s.feito);
    return '<div class="hist-row" title="'+esc(dica)+'"><span class="hist-lab'+(eAtual?" atual":"")+'">'+fmtDM(s.ws)+'</span><div class="hist-track"><span class="hist-plan" style="width:'+pp+'%"></span><span class="hist-bar" style="width:'+pc+'%"></span></div><span class="hist-val hours">'+fmtHM(s.crono)+' <span class="muted">/ '+fmtHM(s.plano)+'</span></span></div>';
  }).join("")+'</div><p class="small muted"><span class="key key-bar"></span> registrado &nbsp; <span class="key key-plan"></span> planejado (semana padrão ou o ajuste daquela semana, mais as leituras extraordinárias)</p></section>';
  const desde=iso(addDays(atual,-21)),ult=S.sessoes.filter(x=>x.data>=desde),porTrilha={};
  ult.forEach(x=>{const k=x.trilha||"";porTrilha[k]=(porTrilha[k]||0)+(Number(x.minutos)||0)});
  const linhas=Object.entries(porTrilha).sort((a,b)=>b[1]-a[1]),maxt=Math.max(1,...linhas.map(l=>l[1]));
  h+='<section class="card"><h3>Por trilha, últimas 4 semanas</h3>'+(linhas.length?'<div class="hist">'+linhas.map(([t,m])=>'<div class="hist-row"><span class="hist-lab wide"><span class="dot" style="background:'+(t?T(t).cor:"var(--muted)")+'"></span> '+esc(t?T(t).curto:"Outro estudo")+'</span><div class="hist-track"><span class="hist-bar" style="width:'+Math.round(m/maxt*100)+'%"></span></div><span class="hist-val hours">'+fmtHM(m)+'</span></div>').join("")+'</div>':'<p class="small muted">Nenhuma sessão nas últimas 4 semanas.</p>')+'</section>';

/* =====================================================================
   17. Leitor de matérias (texto da Imprensa dentro do caderno)
   Marcações por cor com nota, + Conceito, + Nome e fichamento.
   As marcações ficam em marcas/{id da matéria}.
   ===================================================================== */
const TAGS_OK=new Set(["P","H1","H2","H3","H4","H5","H6","BLOCKQUOTE","UL","OL","LI","STRONG","B","EM","I","U","A","BR","HR","IMG","FIGURE","FIGCAPTION","SUB","SUP","CODE","PRE","TABLE","THEAD","TBODY","TR","TD","TH","S"]);
const TAGS_FORA=new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","FORM","INPUT","BUTTON","SELECT","TEXTAREA","NOSCRIPT","SVG","CANVAS","VIDEO","AUDIO","NAV","FOOTER","ASIDE","LINK","META"]);
function limparHtml(html){
  const doc=new DOMParser().parseFromString("<div>"+String(html||"")+"</div>","text/html"),raiz=doc.body.firstElementChild,out=document.createElement("div");
  const copiar=(de,para)=>{
    for(const n of [...de.childNodes]){
      if(n.nodeType===3){para.appendChild(document.createTextNode(n.nodeValue));continue}
      if(n.nodeType!==1)continue;
      const t=n.tagName.toUpperCase();
      if(TAGS_FORA.has(t))continue;
      if(!TAGS_OK.has(t)){copiar(n,para);if(/^(DIV|SECTION|ARTICLE|HEADER|MAIN)$/.test(t))para.appendChild(document.createTextNode("\n"));continue}
      if(t==="H1"){const h=document.createElement("h2");copiar(n,h);para.appendChild(h);continue}
      const el=document.createElement(t.toLowerCase());
      if(t==="A"){const h=n.getAttribute("href")||"";if(/^https?:\/\//i.test(h)){el.setAttribute("href",h);el.setAttribute("target","_blank");el.setAttribute("rel","noopener noreferrer")}}
      if(t==="IMG"){const s=n.getAttribute("src")||"";if(!/^https:\/\//i.test(s))continue;el.setAttribute("src",s);el.setAttribute("alt",n.getAttribute("alt")||"");el.setAttribute("loading","lazy");el.setAttribute("referrerpolicy","no-referrer")}
      copiar(n,el);para.appendChild(el);
    }
  };
  if(raiz)copiar(raiz,out);
  return out.innerHTML;
}
const _txtCache=new Map();
function textoCache(a){const k=a.id+":"+String(a.conteudo).length;if(!_txtCache.has(k))_txtCache.set(k,textoDoHtml(a.conteudo));return _txtCache.get(k)}
const textoDoHtml=html=>{const d=document.createElement("div");d.innerHTML=limparHtml(html);return (d.textContent||"").replace(/\s+/g," ").trim()};

/* ---------- posição do texto ⇄ nós ---------- */
function nosDeTexto(raiz){const w=document.createTreeWalker(raiz,NodeFilter.SHOW_TEXT),l=[];let n,pos=0;while((n=w.nextNode())){l.push({n,ini:pos,fim:pos+n.nodeValue.length});pos+=n.nodeValue.length}return l}
function deslocamento(raiz,no,off){const r=document.createRange();r.setStart(raiz,0);r.setEnd(no,off);return r.toString().length}
function envolver(raiz,ini,fim,criar){
  for(const t of nosDeTexto(raiz)){
    if(t.fim<=ini||t.ini>=fim)continue;
    let no=t.n;const a=Math.max(ini,t.ini)-t.ini,b=Math.min(fim,t.fim)-t.ini;
    if(!no.nodeValue.slice(a,b).trim())continue;
    if(b<no.nodeValue.length)no.splitText(b);
    if(a>0)no=no.splitText(a);
    const m=criar();no.parentNode.insertBefore(m,no);m.appendChild(no);
  }
}

function semTituloRepetido(html,titulo){
  const d=document.createElement("div");d.innerHTML=html;const norm=x=>String(x||"").toLowerCase().replace(/\s+/g," ").trim();
  const prim=d.querySelector("h1,h2,h3,p");
  if(prim&&/^H[1-3]$/.test(prim.tagName)&&norm(prim.textContent)===norm(titulo))prim.remove();
  return d.innerHTML;
}

function pintarMarcas(){
  const c=$("mt-corpo");if(!c||!R.web)return;
  c.innerHTML=R.html;const txt=c.textContent;
  R.marcas.slice().sort((a,b)=>a.inicio-b.inicio).forEach(m=>{

    if(txt.slice(ini,fim)!==m.texto){const i=txt.indexOf(m.texto);if(i<0)return;ini=i;fim=i+m.texto.length}
    envolver(c,ini,fim,()=>{const el=document.createElement("mark");el.className="mt-m";el.dataset.act="mt-marca";el.dataset.id=m.id;el.style.setProperty("--m",CORES_AN[m.cor]||CORES_AN.amarelo);if(m.nota)el.classList.add("com-nota");return el});
  });

function selecaoNaMateria(){
  const c=$("mt-corpo"),s=window.getSelection();
  if(!c||!s||s.isCollapsed||!s.rangeCount)return null;
  const r=s.getRangeAt(0);if(!c.contains(r.commonAncestorContainer))return null;
  const ini=deslocamento(c,r.startContainer,r.startOffset),fim=deslocamento(c,r.endContainer,r.endOffset),texto=c.textContent.slice(ini,fim);
  return texto.trim()?{inicio:ini,fim,texto}:null;
}
document.addEventListener("selectionchange",()=>{if(!R.web)return;const s=selecaoNaMateria();if(s)R.sel={...s,em:Date.now()}});
function selecaoRecente(){const s=selecaoNaMateria();if(s)return s;return R.sel&&Date.now()-R.sel.em<60000?R.sel:null}

function marcarTrecho(cor){
  if(S.readOnly)return;
  const s=selecaoRecente();if(!s){toast("Selecione um trecho do texto e depois toque na cor.");return}
  const sobrepostas=R.marcas.filter(m=>m.inicio<s.fim&&m.fim>s.inicio);
  const lista=R.marcas.filter(m=>!sobrepostas.includes(m)).concat([{id:novoId("marcas"),cor,inicio:s.inicio,fim:s.fim,texto:s.texto,nota:sobrepostas.map(m=>m.nota).filter(Boolean).join("\n"),criado:new Date().toISOString()}]);
  R.marcas=lista;R.sel=null;try{window.getSelection().removeAllRanges()}catch(e){}

  salvarMarcasMateria(lista).catch(()=>{});
}

const main=$("main");
function irPara(view,aba){
  if(view==="biblioteca"&&aba)S.bibTab=aba;

function lerHash(){
  const h=(location.hash||"").replace("#","");
  if(HASH_ANTIGO[h]){const [v,a]=HASH_ANTIGO[h];if(v==="biblioteca")S.bibTab=a;else S.cadTab=a;S.view=v;return}
  S.view=VIEWS.includes(h)?h:"hoje";
}
function campoFocado(){const a=document.activeElement;return a&&main.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)?a:null}
function agendarRender(){
  const f=campoFocado();
  if(f){
    if(f.closest("#nota-editor")){pintarListaNotas();return}
    if(f.closest("#conc-editor")){pintarListaConceitos();return}
    if(f.id==="bq"){pintarBusca();return}
    S.dirty=true;return;
  }
  render();
}

function aviso(){
  if(S.offline)return '<div class="banner">Não foi possível acessar o banco de dados do caderno. Verifique a conexão e recarregue a página.</div>';
  if(S.slow)return '<div class="banner">O armazenamento está demorando para responder. O que aparece pode estar desatualizado.</div>';
  if(S.readOnly)return '<div class="banner">Você está vendo este caderno sem permissão de edição.</div>';
  return "";
}
function render(){
  lerHash();

  const info=cicloAtualInfo();$("brand-sub").textContent=S.cfg?etapaLabel(etapaAtual())+(info?" · "+info.titulo:""):"";
  if(!S.ready){main.innerHTML='<p class="muted">Carregando seu caderno…</p>'+aviso();return}
  const telas={hoje:telaHoje,semana:telaSemana,biblioteca:telaBiblioteca,caderno:telaCaderno,plano:telaPlano,busca:telaBusca,historico:telaHistorico};

  if(S.view==="busca"){pintarBusca();const q=$("bq");if(q&&document.activeElement!==q&&!S.bq)q.focus()}
  pintarCronometro();
}

  "notas-copiar":()=>{const l=notasFiltradas();if(!l.length)return toast("Nada para copiar.");copy(l.map(notaTexto).join("\n---\n\n"))},
  "nota-excluir":el=>{if(!S.draft||!S.draft.id)return;confirmar(el,"Confirmar exclusão",()=>{clearTimeout(notaTimer);remove("notas/"+S.draft.id).then(()=>{S.draft=null;render();toast("Excluído.")}).catch(()=>{})})},
  "nf-limpar-topico":()=>{S.nf.topico="todos";render()},
  "conceito-novo":async el=>{await guardarRascunhos();abrirConceito({id:null,...(el.dataset.tipo==="nome"?{tipo:"nome",periodo:""}:{}),termo:"",definicao:"",leituras:[],notas:[]});S.csave="Novo";setTimeout(()=>{const x=$("ce-termo");if(x)x.focus()},60)},
  "conceito-abrir":async el=>{if(S.cdraft){lerConceito();await salvarConceito()}abrirConceito(S.conceitos.find(c=>c.id===el.dataset.id))},
  "conceito-ir":async el=>{fecharModal();await guardarRascunhos();abrirConceito(S.conceitos.find(c=>c.id===el.dataset.id))},
  "conceito-fechar":async()=>{lerConceito();await salvarConceito();S.cdraft=null;render()},
  "conceito-salvar":()=>{lerConceito();if(S.cdraft)S.cdraft._sujo=true;salvarConceito()},
  "conceito-editar":()=>{S.cread=false;render()},
  "conceito-concluir":async()=>{lerConceito();await salvarConceito();S.cread=true;render()},
  "conceito-autor":()=>{lerConceito();S.cdraft._sujo=true;S.cdraft.leituras.push({autor:"",livroId:"",texto:""});render();setTimeout(()=>{const l=document.querySelectorAll('[data-cl="autor"]');if(l.length)l[l.length-1].focus()},30)},
  "conceito-autor-remover":el=>{lerConceito();S.cdraft.leituras.splice(Number(el.dataset.i),1);render();agendarConceito()},
  "conceito-excluir":el=>{if(!S.cdraft||!S.cdraft.id)return;confirmar(el,"Confirmar exclusão",()=>{clearTimeout(concTimer);const era=ehNome(S.cdraft)?"Nome":"Conceito";remove("conceitos/"+S.cdraft.id).then(()=>{S.cdraft=null;render();toast(era+" excluído.")}).catch(()=>{})})},
  /* plano */
  "plano-salvar":()=>{const n=clone(cfg());n.etapaAtual=Number($("pl-etapa").value);n.inicioEtapa=$("pl-inicio").value||n.inicioEtapa||iso(mondayOf(new Date()));n.rotacao=rotacao().map((t,i)=>$("pl-rot-"+i)?$("pl-rot-"+i).value:t);salvarConfig(n,"Plano atualizado.")},
  "rot-mais":()=>{const n=clone(cfg());n.rotacao=rotacao().map((t,i)=>$("pl-rot-"+i)?$("pl-rot-"+i).value:t);n.rotacao.push(bookTrilhas()[0]||"sintese");S.secAberta="ciclo";salvarConfig(n,"Semana adicionada à rotação.")},
  "rot-menos":()=>{const n=clone(cfg());n.rotacao=rotacao().map((t,i)=>$("pl-rot-"+i)?$("pl-rot-"+i).value:t);if(n.rotacao.length>1)n.rotacao.pop();S.secAberta="ciclo";salvarConfig(n,"Última semana removida da rotação.")},
  "horarios-salvar":()=>{const n=clone(cfg());n.horarios={};DIAS.forEach(d=>{const v=$("hr-"+d.i).value;if(v)n.horarios[d.i]=v});S.secAberta="semana";salvarConfig(n,"Horários salvos.")},
  "ciclos-salvar":()=>{const n=clone(cfg());n.etapas=lerCiclosDoFormulario();S.secAberta="ciclos";salvarConfig(n,"Ciclos salvos.")},
  "ciclo-novo":()=>{const n=clone(cfg());n.etapas=lerCiclosDoFormulario();n.etapas.push({n:Math.max(0,...n.etapas.map(x=>x.n))+1,titulo:"Novo ciclo",objetivo:""});S.secAberta="ciclos";salvarConfig(n,"Ciclo criado. Edite o título e o objetivo.")},
  "ciclo-mover":el=>{const base=lerCiclosDoFormulario().sort((a,b)=>a.n-b.n),ns=base.map(x=>x.n),n=Number(el.dataset.n),m=ns[ns.indexOf(n)+Number(el.dataset.dir)];if(m==null)return toast("Esse ciclo já está na ponta.");const map=x=>x===n?m:(x===m?n:x);S.secAberta="ciclos";remapearCiclos(base.map(x=>({...x,n:map(x.n)})),map,"Ciclos trocados de lugar. Os textos foram junto.")},
  "ciclo-excluir":el=>{const base=lerCiclosDoFormulario().sort((a,b)=>a.n-b.n),ns=base.map(x=>x.n),n=Number(el.dataset.n),k=ns.indexOf(n);if(base.length<2)return;const t=ns[k+1]!=null?ns[k+1]:ns[k-1],ren=x=>x>n?x-1:x,map=x=>ren(x===n?t:x);
    confirmar(el,"Confirmar: textos vão para o Ciclo "+ren(t),()=>{S.secAberta="ciclos";remapearCiclos(base.filter(x=>x.n!==n).map(x=>({...x,n:ren(x.n)})),map,"Ciclo excluído. Os textos foram para o Ciclo "+ren(t)+".")})},
  "trilhas-salvar":()=>salvarTrilhas(lerTrilhas(),"Trilhas salvas."),
  "trilha-nova":()=>{const l=lerTrilhas(),usadas=l.map(x=>x.cor);l.push({id:uid("tr"),nome:"Nova trilha",curto:"Nova trilha",cor:Object.keys(CORES).find(k=>!usadas.includes(k))||"c6"});salvarTrilhas(l,"Trilha criada. Ajuste o nome e a cor.")},
  "trilha-mover":el=>{const l=lerTrilhas(),i=Number(el.dataset.i),j=i+Number(el.dataset.dir);if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];salvarTrilhas(l,"Ordem das trilhas atualizada.")},
  "trilha-excluir":el=>{const l=lerTrilhas(),i=Number(el.dataset.i);if(S.livros.some(b=>b.trilha===l[i].id))return toast("Essa trilha ainda tem textos. Mova ou exclua os textos antes.");confirmar(el,"Confirmar exclusão",()=>{l.splice(i,1);salvarTrilhas(l,"Trilha excluída.")})},
  "modelos-salvar":()=>{const n=clone(cfg());n.modeloSintese=$("ms").value;n.modeloConjuntura=$("mc").value;n.legendaCores={};Object.keys(CORES_AN).forEach(k=>{n.legendaCores[k]=$("lg-"+k).value.trim()||DEFAULT_LEGENDA[k]});S.secAberta="modelos";salvarConfig(n,"Modelos e legenda salvos.")},
  "backup-baixar":async el=>{el.disabled=true;await baixarBackup();el.disabled=false},
  "sair":()=>{if(window.sairDoCaderno)window.sairDoCaderno()},
  "backup-restaurar":()=>{const i=$("bk-file");i.value="";i.click()},
  "backup-confirmar":()=>{const d=S.pendingRestore;S.pendingRestore=null;fecharModal();if(d)restaurar(d)},
  "agenda-baixar":()=>baixarAgenda(),
  /* leitor */
  "rd-fechar":()=>fecharLeitor(),
  "rd-ferramenta":el=>{R.tool=el.dataset.tool;document.querySelector(".reader").dataset.tool=R.tool;document.querySelectorAll(".reader .tool").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tool===R.tool)))},
  "rd-cor":el=>{R.cor=el.dataset.cor;document.querySelectorAll(".reader .swl").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.cor===R.cor)))},
  "rd-zoom":el=>{const i=ZOOMS.indexOf(R.zoom),j=Math.max(0,Math.min(ZOOMS.length-1,i+Number(el.dataset.dir)));if(j===i)return;const pag=R.cur;R.zoom=ZOOMS[j];aplicarZoom();setTimeout(()=>{const pg=R.pages[pag-1];if(pg)pg.el.scrollIntoView({block:"start"})},30)},
  "rd-lateral":()=>{const sd=$("rd-side");if(sd){sd.hidden=!sd.hidden;pintarLateral()}},
  "rd-ir":el=>{const pg=R.pages&&R.pages[Number(el.dataset.n)-1];if(pg)pg.el.scrollIntoView({block:"start",behavior:"smooth"});if(window.innerWidth<=760){$("rd-side").hidden=true}},
  "rd-conceito":()=>dialogoConceitoPdf("conceito"),
  "rd-nome":()=>dialogoConceitoPdf("nome"),
  "cp-salvar":el=>{const tipo=el.dataset.tipo||"conceito",nome=$("cp-nome").value,tx=$("cp-texto").value;if(!nome.trim())return toast(tipo==="nome"?"Escreva o nome.":"Escreva o nome do conceito.");fecharModal();registrarConceito(nome,tx,R.cur,tipo).catch(()=>{})},
  "np-salvar":()=>{
    const c=S.noteCtx;if(!c||!R.livroId)return fecharModal();
    const txt=$("np-texto").value.trim(),conc=$("np-conc")?$("np-conc").value.trim():"";
    if(c.i!=null){const a=(R.anot[c.n]||[])[c.i];if(a){a.texto=txt;desenharMarcas(c.n);pintarLateral();salvarMarcas(c.n)}}
    else addMarca(c.n,{tipo:"nota",x:c.x,y:c.y,texto:txt,cor:R.cor});
    if(conc)registrarConceito(conc,txt,c.n).catch(()=>{});
    S.noteCtx=null;fecharModal();
  },
  "np-excluir":()=>{const c=S.noteCtx;if(c&&c.i!=null&&R.livroId){(R.anot[c.n]||[]).splice(c.i,1);desenharMarcas(c.n);pintarLateral();salvarMarcas(c.n)}S.noteCtx=null;fecharModal()},
  "rd-fichamento":()=>{
    const it=itemDeLeitura(R.livroId),b=it&&it.x,lg=legenda(),linhas=[];
    Object.keys(R.anot).map(Number).sort((a,c)=>a-c).forEach(n=>(R.anot[n]||[]).forEach(a=>{if(a.tipo==="nota")linhas.push("- p. "+n+" ("+(lg[a.cor]||"nota")+"): "+String(a.texto||"").replace(/\n+/g," "))}));
    const id=R.livroId;fecharLeitor();
    novaNota({...(it&&it.col==="artigos"?{artigoId:id}:{livroId:id}),titulo:"Notas — "+(b?b.titulo:"texto"),texto:"## Notas feitas na leitura\n"+linhas.join("\n")+"\n"});
  }
};
function lerTrilhas(){return trilhas().map((t,i)=>{const g=id=>$(id)?$(id).value:null;return {id:t.id,nome:(g("tr-n-"+i)||t.nome).trim()||t.nome,curto:(g("tr-c-"+i)||t.curto||t.nome).trim(),cor:g("tr-cor-"+i)||t.cor}})}
function salvarTrilhas(l,msg){const n=clone(cfg());n.trilhas=l;S.secAberta="trilhas";return salvarConfig(n,msg)}

document.addEventListener("mousedown",e=>{if(e.target.closest(".materia .rd-bar button"))e.preventDefault()});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const fn=ACOES[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener("change",e=>{
  const el=e.target,act=el.dataset&&el.dataset.act;
  if(el.id==="bk-file"){const f=el.files&&el.files[0];if(f)lerBackup(f);return}
  if(el.id==="pdf-input"){importarPdf(el.files&&el.files[0]);return}
  if(act==="livro-status"){const b=livro(el.dataset.id);el.blur();if(b)mudarStatusLivro(b,el.value).catch(()=>{});return}
  if(act==="livro-ciclo"){const b=livro(el.dataset.id);el.blur();if(b)mudarCicloLivro(b,Number(el.value));return}
  if(act==="topico-status"){const tp=topico(el.dataset.id);el.blur();if(tp)mudarStatusTopico(tp,el.value).catch(()=>{});return}
  if(act&&act.startsWith("slot-")&&S.editWeek){
    const d=el.dataset.dia,i=Number(el.dataset.idx),s=S.editWeek[d][i];
    if(act==="slot-trilha")s.trilha=el.value;else if(act==="slot-min")s.min=Number(el.value);
    else if(act==="slot-dia"&&el.value!==d){S.editWeek[d].splice(i,1);(S.editWeek[el.value]=S.editWeek[el.value]||[]).push(s)}
    render();return;
  }
  if(el.classList.contains("motivo")){const v=el.value.trim();salvarSemana(d=>{d.motivos=d.motivos||{};if(v)d.motivos[el.dataset.dia]=v;else delete d.motivos[el.dataset.dia]}).catch(()=>{});return}
  if(el.id==="af-fonte"||el.id==="af-status"){S.af[el.id.slice(3)]=el.value;render();return}
  if(["fl-etapa","fl-trilha","fl-status"].includes(el.id)){const k=el.id.slice(3);S.fl[k]=k==="etapa"&&!isNaN(el.value)?Number(el.value):el.value;render();return}
  if(el.id==="tf-ordem"){S.tf.ordem=el.value;pintarTudo();return}
  if(el.id==="nf-tipo"||el.id==="nf-livro"){S.nf[el.id.slice(3)]=el.value;pintarListaNotas();return}
  if(el.id==="ne-tipo"&&el.value==="conjuntura"&&S.draft&&$("ne-texto")&&!$("ne-texto").value.trim())$("ne-texto").value=cfg().modeloConjuntura||DEFAULT_MODELO_CONJUNTURA;
  if(/^ne-(tipo|livro|topico)$/.test(el.id)){lerNota();agendarNota();return}
  if(el.dataset&&el.dataset.cn&&S.cdraft){lerConceito();const set=new Set(S.cdraft.notas||[]);el.checked?set.add(el.dataset.cn):set.delete(el.dataset.cn);S.cdraft.notas=[...set];agendarConceito();return}
  if(el.dataset&&el.dataset.cl&&S.cdraft){lerConceito();agendarConceito();return}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="nf-q"){S.nf.q=el.value;pintarListaNotas();return}
  if(el.id==="cq"){S.cq=el.value;pintarListaConceitos();return}
  if(el.id==="tq"){S.tq=el.value;pintarTudo();return}
  if(el.id==="cnq"){S.cnq=el.value;pintarNotasDoConceito();return}
  if(el.id==="bq"){S.bq=el.value;pintarBusca();return}
  if(el.id&&el.id.startsWith("ne-")){lerNota();agendarNota();return}
  if(S.cdraft&&(el.id==="ce-termo"||el.id==="ce-def"||(el.dataset&&el.dataset.cl))){lerConceito();agendarConceito()}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("details.sec")&&d.open)S.secAberta=d.dataset.sec},true);
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(modalAberto())fecharModal();else if(leitorAberto())fecharLeitor()});
window.addEventListener("hashchange",async()=>{
  const antes=S.view;
  if(antes==="caderno"){const dest=(location.hash||"").replace("#","");if(dest!=="caderno"&&!HASH_ANTIGO[dest]){await guardarRascunhos()}}
  if(S.view!=="historico"&&(location.hash||"")==="#historico")S.semanasCache=null;
  render();
});
window.addEventListener("pagehide",()=>{guardarRascunhos();if(TM.fase==="foco"){const m=minutosDaSessao();if(m>=5)registrarSessao(m)}});

/* =====================================================================
   14. Início
   ===================================================================== */
async function iniciar(){
  ligarPonteiroDoLeitor();
  irParaSemana(mondayOf(new Date()));
  render();
  let db=null;
  try{db=window.claude&&typeof window.claude.use==="function"?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){S.offline=true;S.ready=true;render();return}
  S.db=db;
  const lento=setTimeout(()=>{S.slow=true;S.ready=true;render()},10000);
  const pronto=()=>{if(!S.ready&&S.loaded.cfg&&S.loaded.livros&&S.loaded.notas){S.ready=true;S.slow=false;clearTimeout(lento)}agendarRender()};
  const falha=e=>{if(e&&e.code==="revoked")S.offline=true;S.ready=true;clearTimeout(lento);render()};
  const ouvir=(col,chave)=>db.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));if(chave&&(!snap.metadata.fromCache||snap.size))S.loaded[chave]=true;pronto()},chave?falha:()=>{});
  db.doc("plano/config").onSnapshot(snap=>{S.cfg=snap.exists?snap.data():null;if(!snap.metadata.fromCache||S.cfg)S.loaded.cfg=true;pronto()},falha);
  ouvir("livros","livros");ouvir("notas","notas");ouvir("topicos");ouvir("conceitos");ouvir("sessoes");ouvir("artigos");
  S.weekStart=null;irParaSemana(mondayOf(new Date()));
  window.claude.use("assets").then(a=>{S.assets=a;agendarRender()}).catch(()=>{});
  window.claude.use("downloads").then(d=>{S.downloads=d;agendarRender()}).catch(()=>{});
}
iniciar();

</script>
