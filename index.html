<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caderno de Estudos Marxistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  /* Caderno de trabalho: uma coluna central; cada trilha é uma faixa de cor à esquerda */
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#eceef2; --ink:#1a1f2b; --muted:#5b6272; --line:#dadde4;
  --accent:#a8231c; --accent-soft:#f6e3e1; --ok:#1c735b;
  --t-marx:#a8231c; --t-teoria:#34479c; --t-al:#1c735b; --t-lateral:#94661f; --t-sintese:#64528a; --t-rotativo:#5b6272;
  --t-c6:#1f6a85; --t-c7:#8a2f61; --t-c8:#56702a;
  --display:"Literata", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171d; --surface:#1c2028; --sunk:#232833; --ink:#e7e9ee; --muted:#9aa1b0; --line:#323846;
    --accent:#e2675e; --accent-soft:#3a2224; --ok:#4fbf9c;
    --t-marx:#e2675e; --t-teoria:#8797e6; --t-al:#4fbf9c; --t-lateral:#d6a55a; --t-sintese:#ad98d6; --t-rotativo:#9aa1b0;
    --t-c6:#5fb3d1; --t-c7:#d97fb2; --t-c8:#a3c46a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171d; --surface:#1c2028; --sunk:#232833; --ink:#e7e9ee; --muted:#9aa1b0; --line:#323846;
  --accent:#e2675e; --accent-soft:#3a2224; --ok:#4fbf9c;
  --t-marx:#e2675e; --t-teoria:#8797e6; --t-al:#4fbf9c; --t-lateral:#d6a55a; --t-sintese:#ad98d6; --t-rotativo:#9aa1b0;
  --t-c6:#5fb3d1; --t-c7:#d97fb2; --t-c8:#a3c46a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:600}
h2{font-size:20px} h3{font-size:16px}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}

/* Cabeçalho e navegação */
header.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand h1{font-size:19px}
.brand .side{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}

/* Elementos básicos */
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.more{padding:3px 10px;font-size:16px;line-height:1.1;letter-spacing:1px}
select,input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px;max-width:100%}
textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f>*{color:var(--ink)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:500;white-space:nowrap}
.pill.hot{background:var(--accent);color:#fff}
.pill.soft{background:var(--accent-soft);color:var(--accent)}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none;align-self:flex-start}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none}
@media (max-width:480px){.seg{flex-wrap:wrap;overflow:visible}.seg button{padding:5px 9px;font-size:13px}}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.hours{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
select.mini{font-size:12px;padding:2px 6px;border-radius:99px}
select.st-lendo{background:var(--c,var(--accent));color:#fff;border-color:var(--c,var(--accent))}
select.st-concluido{color:var(--ok);border-color:var(--ok)}
select.st-pausado{border-style:dashed;color:var(--muted)}

/* Faixas (blocos de estudo, livros, itens) */
.strip{border-left:4px solid var(--c);background:var(--sunk);border-radius:0 8px 8px 0;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.strip .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.lab .n{text-transform:none;letter-spacing:0;font-weight:400}
.tt{font-family:var(--display);font-size:15px;line-height:1.35;font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.strip.done{opacity:.6}
.strip.skipped{background:transparent;border:1px dashed var(--line);border-left:4px dashed var(--c)}
.strip.skipped .tt{text-decoration:line-through;color:var(--muted)}
.miss{color:var(--accent)}
.check{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--muted);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;color:#fff}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.check svg{width:16px;height:16px}
.linkish{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.linkish:hover{text-decoration:underline}

/* Semana */
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav .range{font-family:var(--display);font-size:17px;min-width:140px;text-align:center}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.day-foot input{flex:1;min-width:140px;font-size:13px}
/* Semana no computador: 7 colunas, como uma agenda */
@media (min-width:1000px){
  body[data-view=semana] main,body[data-view=semana] .top-in{max-width:1500px}
  .days{grid-template-columns:repeat(7,minmax(136px,1fr));gap:8px;align-items:stretch;overflow-x:auto;padding-bottom:2px}
  .day .strip{position:relative}
  .day .strip .body{padding-right:30px}
  .day .strip .acts{position:absolute;top:6px;right:5px}
  .day .strip .lab,.day .strip .tt{overflow-wrap:break-word}
  .day .strip .body .btn,.day-foot .btn{white-space:normal;text-align:left;padding-left:0;padding-right:0}
  .day{padding:8px;gap:6px;min-height:340px}
  .day-h{flex-direction:column;align-items:flex-start;gap:2px;padding:2px 2px 6px;border-bottom:1px solid var(--line)}
  .day-h h3{font-size:15px;line-height:1.25}
  .day-h h3 .small{display:block;font-family:var(--body);font-weight:400;margin-top:1px}
  .day .strip{padding:8px 6px 8px 9px;gap:6px}
  .day .strip .tt{font-size:14px;line-height:1.3}
  .day .strip .check{width:26px;height:26px}
  .day-foot{margin-top:auto}
  .day-foot input{min-width:0;width:100%}
  .day .strip.edit{flex-direction:column;align-items:stretch}
  .day .strip.edit select{width:100%}
}
.now-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.now{border-left:4px solid var(--c);padding:4px 10px;background:var(--sunk);border-radius:0 6px 6px 0}
.editbar{background:var(--surface);border:1px dashed var(--muted);border-radius:10px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.strip.edit{align-items:center;flex-wrap:wrap}
.strip.edit select{font-size:13px;padding:4px 6px}

/* Biblioteca */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.group{display:flex;flex-direction:column;gap:8px}
.group-h{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--c,var(--line));padding-bottom:4px}
.book{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:0 8px 8px 0;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.book .tt{font-size:16px}
.book .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.book .full{grid-column:1/-1}
.book .side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.book.concluido .tt{text-decoration:line-through;text-decoration-color:var(--muted)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.prog .meter{flex:1;height:6px}
.prog .meter>span{background:var(--c)}
.topic-card{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.topic-card:hover{border-color:var(--muted)}

/* Listas e editores (caderno) */
.split{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px}
.items{display:flex;flex-direction:column;gap:6px;max-height:68vh;overflow:auto}
.item{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:0 6px 6px 0;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%;font:inherit;color:inherit}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item .tt{font-size:14px}
.item .sub{font-size:12px}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.editor .title{font-family:var(--display);font-size:20px;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0;width:100%;background:transparent}
.editor textarea.long{min-height:46vh;font-family:var(--display);font-size:16px;line-height:1.65;padding:12px}
.editor textarea.short{font-size:14px}
.preview{font-family:var(--display);font-size:16px;line-height:1.65;max-width:68ch;min-height:46vh}
.preview blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--accent);color:var(--muted)}
.preview h3{font-size:19px;margin:12px 0 4px} .preview h4{font-size:16px;margin:10px 0 4px}
.preview p{margin:0 0 10px}
.nota-tit{font-size:24px;margin:4px 0 0;line-height:1.25}
.leitura-nota .preview{min-height:0}
.savestate{font-size:12px;color:var(--muted)}
.leitura{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.checklist{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px}
.checklist label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.7}
@media (max-width:760px){
  .split{grid-template-columns:1fr}
  .split.open .list{display:none}
  .split:not(.open) .editor-wrap{display:none}
  .items{max-height:none}
}

/* Plano */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.sec>summary{cursor:pointer;padding:12px 14px;font-family:var(--display);font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";color:var(--muted);font-family:var(--body)}
details.sec[open]>summary::after{content:"–"}
details.sec>.in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.sub-item{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.sub-item.atual{border-left:4px solid var(--accent);padding-left:10px}
table.tpl{border-collapse:collapse;width:100%;font-size:14px}
table.tpl td,table.tpl th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tplwrap{overflow-x:auto}
ul.help{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px}

/* Histórico */
.hist{display:flex;flex-direction:column;gap:8px}
.hist-row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center}
.hist-lab{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hist-lab.wide{grid-column:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-lab.atual{color:var(--ink);font-weight:600}
.hist-track{position:relative;height:14px;background:var(--sunk);border-radius:4px}
.hist-plan{position:absolute;left:0;top:0;bottom:0;border:1.5px dashed var(--muted);border-radius:4px}
.hist-bar{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent);border-radius:0 4px 4px 0}
.hist-val{font-size:13px;white-space:nowrap}
.key{display:inline-block;width:14px;height:8px;vertical-align:1px;border-radius:2px}
.key-bar{background:var(--accent)} .key-plan{border:1.5px dashed var(--muted)}
.hist-row:has(.wide){grid-template-columns:150px 1fr auto}
/* Hoje e cronômetro */
.clock{font-size:22px;font-family:var(--display)}

/* Diálogos e avisos */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.5);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.dialog fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list .btn{justify-content:flex-start;padding:10px 12px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

/* Leitor */
body.reading{overflow:hidden}
.reader{position:fixed;inset:0;z-index:40;background:var(--sunk);display:flex;flex-direction:column}
.rd-bar{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rd-title{font-family:var(--display);font-weight:600;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-body{flex:1;display:flex;min-height:0;position:relative}
.rd-scroll{flex:1;overflow:auto;padding:16px 12px 80px}
#rd-pages{margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pg{position:relative;width:100%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.08)}
.pg canvas,.pg svg{position:absolute;inset:0;width:100%;height:100%}
.pgnum{position:absolute;bottom:-18px;right:0;font-size:11px;color:var(--muted)}
.reader[data-tool="ler"] .pg svg{pointer-events:none}
.reader[data-tool="ler"] .pg svg .pin{pointer-events:auto;cursor:pointer}
.reader:not([data-tool="ler"]) .pg svg{touch-action:none;cursor:crosshair}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.swl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px 3px 6px;font-size:12px;font-weight:500;cursor:pointer}
.swl[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.rd-side{width:300px;border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.legend-sum{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
@media (max-width:760px){.rd-side{position:absolute;right:0;top:0;bottom:0;width:88%;box-shadow:-6px 0 20px rgba(0,0,0,.2);z-index:2}}
/* Leitor de matérias */
.materia .rd-scroll{background:var(--surface)}
.mt-texto{max-width:68ch;margin:0 auto;font-family:var(--display);font-size:18px;line-height:1.7;color:var(--ink);padding:8px 4px 40px}
.mt-texto h1{font-size:28px;line-height:1.2;margin:6px 0 10px}
.mt-texto h2{font-size:22px;margin:24px 0 8px} .mt-texto h3{font-size:19px;margin:20px 0 6px}
.mt-texto p{margin:0 0 14px} .mt-texto img{max-width:100%;height:auto;border-radius:6px} .mt-texto figure{margin:14px 0}
.mt-texto figcaption{font-size:13px;color:var(--muted);font-family:var(--body)}
.mt-texto blockquote,.mt-cit{margin:12px 0;padding:4px 14px;border-left:3px solid var(--accent);color:var(--muted)}
.mt-texto a{color:var(--accent)}
.mt-fina{font-size:19px;color:var(--muted)}
.mt-cab{border-bottom:1px solid var(--line);margin-bottom:18px;padding-bottom:8px}
.mt-dica{font-family:var(--body);border-top:1px solid var(--line);padding-top:10px;margin-top:24px}
mark.mt-m{background:color-mix(in srgb,var(--m) 45%,transparent);color:inherit;border-radius:2px;cursor:pointer;padding:0 1px}
mark.mt-m.com-nota{border-bottom:2px dotted var(--ink)}
mark.mt-m.pisca{outline:3px solid var(--accent)}
.materia .rd-bar .swl{user-select:none;-webkit-user-select:none}
@media (max-width:600px){.materia .rd-bar{gap:6px;padding:6px 8px}.materia .swl-t{display:none}.materia .swl{padding:4px 7px}.materia .swl .dot{width:14px;height:14px}.materia .rd-title{flex-basis:calc(100% - 90px)}.mt-texto{font-size:17px}}
</style>
<style>
#sb-login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}

<script>
/* =====================================================================
   0. Conexão com o Supabase (versão independente do Claude)
   Preencha as duas linhas abaixo com os dados do seu projeto Supabase:
   Project Settings › API › Project URL e chave "anon public".
   ===================================================================== */
const SUPABASE_URL = "https://yiijoqesiadcuoqmyogf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_C7gWfaR3_bFOe06KhJeAOA_bE3AY-MB";

(function(){
  const BUCKET = "pdfs";
  let guardado = {};try{guardado = JSON.parse(localStorage.getItem("caderno-supabase") || "{}")}catch(e){}
  const valido = (u, k) => /^https:\/\/[^\s]+$/.test(u || "") && String(k || "").length > 20;
  const URL_SB = valido(SUPABASE_URL, SUPABASE_ANON_KEY) ? SUPABASE_URL : guardado.url;
  const CHAVE_SB = valido(SUPABASE_URL, SUPABASE_ANON_KEY) ? SUPABASE_ANON_KEY : guardado.chave;
  const configurado = valido(URL_SB, CHAVE_SB);
  let sb = null;
  if(configurado && window.supabase){try{sb = window.supabase.createClient(URL_SB, CHAVE_SB, {auth:{persistSession:true,autoRefreshToken:true}})}catch(e){sb = null}}
  let usuario = null, resolverLogin, prontoLogin = new Promise(r => resolverLogin = r);

  /* ---------- tela de login ---------- */
  function telaLogin(msg, emailAnterior){
    let el = document.getElementById("sb-login");
    if(!el){el = document.createElement("div");el.id = "sb-login";document.body.appendChild(el)}
    if(!sb){
      if(!window.supabase){el.innerHTML = '<div class="sb-box"><h2>Caderno de Estudos</h2><p class="small">Não foi possível carregar a conexão com o banco de dados. Verifique a internet e recarregue a página.</p></div>';return}
      el.innerHTML = '<form class="sb-box" id="sb-cfg"><h2>Conectar ao banco de dados</h2>'
        + '<p class="small muted">Só na primeira vez em cada aparelho. No Supabase: Project Settings › API.</p>'
        + '<label class="small">Project URL<input id="sb-url" type="url" placeholder="https://xxxx.supabase.co" required></label>'
        + '<label class="small">Chave anon public<input id="sb-chave" type="text" autocomplete="off" required></label>'
        + (msg ? '<p class="small sb-erro">' + msg + '</p>' : '')
        + '<button class="btn primary" type="submit">Conectar</button></form>';
      document.getElementById("sb-cfg").addEventListener("submit", ev => {
        ev.preventDefault();
        const url = document.getElementById("sb-url").value.trim().replace(/\/+$/, ""), chave = document.getElementById("sb-chave").value.trim();
        if(!valido(url, chave)){telaLogin("Confira a URL (começa com https://) e a chave.");return}
        localStorage.setItem("caderno-supabase", JSON.stringify({url, chave}));location.reload();
      });
      return;
    }
    el.innerHTML = '<form class="sb-box" id="sb-form"><h2>Caderno de Estudos</h2>'
      + '<label class="small">E-mail<input id="sb-email" type="email" autocomplete="username" required value="' + String(emailAnterior || "").replace(/[&"<>]/g, c => ({"&":"&amp;",'"':"&quot;","<":"&lt;",">":"&gt;"})[c]) + '"></label>'
      + '<label class="small">Senha<input id="sb-senha" type="password" autocomplete="current-password" required></label>'
      + (msg ? '<p class="small sb-erro">' + msg + '</p>' : '')
      + '<button class="btn primary" type="submit">Entrar</button>'
      + '<p class="small muted">Você só precisa entrar uma vez em cada aparelho.</p></form>';
    document.getElementById("sb-form").addEventListener("submit", async ev => {
      ev.preventDefault();
      const email = document.getElementById("sb-email").value.trim(), password = document.getElementById("sb-senha").value;
      const btn = ev.target.querySelector("button");btn.disabled = true;btn.textContent = "Entrando…";
      const {data, error} = await sb.auth.signInWithPassword({email, password});
      if(error){telaLogin("E-mail ou senha incorretos.", email);const s = document.getElementById("sb-senha");if(s)s.focus();return}
      entrou(data.user);
    });
    const e = document.getElementById("sb-email");if(e && !emailAnterior)e.focus();
  }
  function entrou(u){
    usuario = u;
    const el = document.getElementById("sb-login");if(el)el.remove();
    resolverLogin(u);
  }
  window.sairDoCaderno = async function(){
    if(sb) await sb.auth.signOut();
    location.reload();
  };

  /* ---------- banco: imita a API db do claude.ai ---------- */
  const cache = {};          // col -> Map(id -> data)
  const carregando = {};     // col -> Promise
  const ouvintes = new Set();// {col, id?, campo?, valor?, cb, err}
  const erro = (e, code) => {const x = new Error(((e && e.message) || String(e)) + (e && e.code ? " [" + e.code + "]" : "") + (e && e.hint ? " " + e.hint : ""));x.code = code || "unavailable";return x};
  const novoIdLocal = () => {const c = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";let s = "";const r = crypto.getRandomValues(new Uint8Array(20));for(const b of r)s += c[b % 62];return s};
  const partes = p => {const i = String(p).indexOf("/");return [p.slice(0, i), p.slice(i + 1)]};
  const copia = d => d == null ? d : JSON.parse(JSON.stringify(d));

  async function buscarColecao(col){
    const mapa = new Map();let de = 0;const passo = 1000;
    for(;;){
      const {data, error} = await sb.from("docs").select("id,data").eq("col", col).range(de, de + passo - 1);
      if(error) throw erro(error);
      data.forEach(r => mapa.set(r.id, r.data));
      if(data.length < passo) break;de += passo;
    }
    cache[col] = mapa;return mapa;
  }
  function garantir(col){
    if(cache[col]) return Promise.resolve(cache[col]);
    if(!carregando[col]) carregando[col] = buscarColecao(col).finally(() => {delete carregando[col]});
    return carregando[col];
  }
  const docSnap = (id, d) => ({id, exists: d !== undefined, data: () => copia(d), metadata: {fromCache: false}});
  function colSnap(col, campo, valor){
    const docs = [];
    for(const [id, d] of (cache[col] || new Map())) if(!campo || (d && d[campo] === valor)) docs.push(docSnap(id, d));
    return {docs, size: docs.length, empty: !docs.length, metadata: {fromCache: false}};
  }
  function avisar(col, id){
    for(const o of ouvintes){
      if(o.col !== col || !cache[col]) continue;
      if(o.id !== undefined){if(o.id === id) o.cb(docSnap(id, cache[col].get(id)))}
      else o.cb(colSnap(col, o.campo, o.valor));
    }
  }
  function aplicar(col, id, d){
    if(!cache[col]) return;
    if(d === undefined) cache[col].delete(id); else cache[col].set(id, d);
    avisar(col, id);
  }
  function ouvir(o){
    ouvintes.add(o);
    garantir(o.col).then(() => {
      if(!ouvintes.has(o)) return;
      if(o.id !== undefined) o.cb(docSnap(o.id, cache[o.col].get(o.id)));
      else o.cb(colSnap(o.col, o.campo, o.valor));
    }).catch(e => {if(o.err) o.err(e)});
    return () => ouvintes.delete(o);
  }
  async function recarregarTudo(){
    for(const col of Object.keys(cache)){
      try{await buscarColecao(col);for(const o of ouvintes) if(o.col === col){
        if(o.id !== undefined) o.cb(docSnap(o.id, cache[col].get(o.id))); else o.cb(colSnap(col, o.campo, o.valor));
      }}catch(e){}
    }
  }

  function consulta(col, campo, valor){
    return {
      get: async () => {await buscarColecao(col);return colSnap(col, campo, valor)},
      onSnapshot: (cb, err) => ouvir({col, campo, valor, cb, err})
    };
  }
  const db = {
    doc(path){
      const [col, id] = partes(path);
      return {
        id,
        async set(data){
          const limpo = copia(data);
          const {error} = await sb.from("docs").upsert({owner: usuario.id, col, id, data: limpo, updated_at: new Date().toISOString()}, {onConflict: "owner,col,id"});
          if(error) throw erro(error, /quota|limit/i.test(error.message) ? "quota_exceeded" : "unavailable");
          aplicar(col, id, limpo);
        },
        async delete(){
          const {error} = await sb.from("docs").delete().eq("col", col).eq("id", id);
          if(error) throw erro(error);
          aplicar(col, id, undefined);
        },
        async get(){await garantir(col);return docSnap(id, cache[col].get(id))},
        onSnapshot: (cb, err) => ouvir({col, id, cb, err})
      };
    },
    collection(col){
      return {
        doc: id => db.doc(col + "/" + (id || novoIdLocal())),
        get: () => consulta(col).get(),
        where: (campo, op, valor) => consulta(col, campo, valor),
        onSnapshot: (cb, err) => ouvir({col, cb, err})
      };
    }
  };

  /* ---------- tempo real: mudanças feitas em outro aparelho ---------- */
  function ligarTempoReal(){
    let primeira = true;
    sb.channel("docs-" + usuario.id)
      .on("postgres_changes", {event: "*", schema: "public", table: "docs"}, p => {
        if(p.eventType === "DELETE"){const o = p.old || {};if(o.col && o.id) aplicar(o.col, o.id, undefined)}
        else {const n = p.new || {};if(n.owner === usuario.id) aplicar(n.col, n.id, n.data)}
      })
      .subscribe(status => {
        if(status === "SUBSCRIBED"){if(!primeira) recarregarTudo();primeira = false}
      });
    document.addEventListener("visibilitychange", () => {if(document.visibilityState === "visible") recarregarTudo()});
  }

  /* ---------- PDFs ---------- */
  const assets = {
    async upload(file){
      const id = novoIdLocal();
      const {error} = await sb.storage.from(BUCKET).upload(usuario.id + "/" + id + ".pdf", file, {contentType: "application/pdf", upsert: false});
      if(error) throw erro(error, /size|large/i.test(error.message) ? "too_large" : /quota/i.test(error.message) ? "quota_or_state" : "unavailable");
      return {id};
    },
    async delete(id){
      const {error} = await sb.storage.from(BUCKET).remove([usuario.id + "/" + id + ".pdf"]);
      if(error) throw erro(error);
    },
    async baixar(id){
      const {data, error} = await sb.storage.from(BUCKET).download(usuario.id + "/" + id + ".pdf");
      if(error) throw erro(error);
      return await data.arrayBuffer();
    }
  };

  /* ---------- Imprensa: chama a função "imprensa" do Supabase ---------- */
  if(sb) window.cadernoImprensa = async function(){
    const {data, error} = await sb.functions.invoke("imprensa", {body: {}});
    if(error){
      let msg = error.message || "erro";
      try{const r = error.context;if(r && typeof r.json === "function"){const j = await r.clone().json().catch(() => null);msg = (j && (j.erro || j.message || j.msg)) || (r.status === 404 ? "404 — função não encontrada" : msg + " (" + r.status + ")")}}catch(e){}
      throw new Error(msg);
    }
    return typeof data === "string" ? JSON.parse(data) : data;
  };

  /* ---------- downloads ---------- */
  const downloads = {
    async save({filename, data}){
      const tipo = /\.json$/i.test(filename) ? "application/json" : /\.csv$/i.test(filename) ? "text/csv" : "application/octet-stream";
      const url = URL.createObjectURL(new Blob([data], {type: tipo + ";charset=utf-8"}));
      const a = document.createElement("a");a.href = url;a.download = filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
  };

  /* ---------- ponto de entrada usado pelo app ---------- */
  window.claude = {
    async use(nome){
      if(!sb){telaLogin();await new Promise(() => {})}
      await prontoLogin;
      if(nome === "db"){ligarTempoRealUmaVez();return db}
      if(nome === "assets") return assets;
      if(nome === "downloads") return downloads;
      throw erro("recurso desconhecido");
    }
  };
  let tempoRealLigado = false;
  function ligarTempoRealUmaVez(){if(!tempoRealLigado){tempoRealLigado = true;try{ligarTempoReal()}catch(e){}}}

  /* ---------- sessão ---------- */
  async function verificarSessao(){
    if(!sb){telaLogin();return}
    const {data} = await sb.auth.getSession();
    if(data && data.session) entrou(data.session.user); else telaLogin();
    sb.auth.onAuthStateChange((ev, s) => {if(ev === "SIGNED_OUT") location.reload()});
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", verificarSessao); else verificarSessao();
})();

</script>

  conceito:{aba:"conceitos",titulo:"Conceitos",um:"conceito",Um:"Conceito",termo:"Nome do conceito",busca:"Buscar conceito ou autor",def:"Definição geral",

    intro:"Registre pessoas, autores e organizações citados nas leituras. Cada vez que o nome aparecer, acrescente uma citação: o caderno junta os textos, ciclos e trilhas em que ele surge."}

const regsDo=tipo=>S.conceitos.filter(c=>tipo==="nome"?ehNome(c):!ehNome(c));
function aparicoes(c){
  const ls=[...new Set((c.leituras||[]).map(l=>l.livroId).filter(Boolean))].map(id=>itemDeLeitura?(itemDeLeitura(id)||{}).x:null).filter(Boolean);
  const ciclos=[...new Set(ls.map(b=>b.etapa).filter(e=>e!=null&&e!==""))].sort((a,b)=>a-b);
  const trs=[...new Set(ls.map(b=>b.trilha).filter(Boolean))];
  return {textos:ls,ciclos,trilhas:trs};

const HASH_ANTIGO={livros:["biblioteca","textos"],topicos:["biblioteca","topicos"],fichamentos:["caderno","fichamentos"],sinteses:["caderno","sinteses"],conceitos:["caderno","conceitos"]};

/* =====================================================================
   2. Estado
   ===================================================================== */
const S={
  db:null,assets:null,downloads:null,offline:false,readOnly:false,ready:false,slow:false,
  cfg:null,livros:[],topicos:[],notas:[],conceitos:[],sessoes:[],artigos:[],af:{fonte:"todas",status:"novos"},semanasCache:null,semanaDoc:null,unsubSemana:null,
  loaded:{cfg:false,livros:false,notas:false},
  view:"hoje",bibTab:"textos",cadTab:"tudo",tf:{tipo:"todos",ordem:"recentes"},tq:"",topicoAberto:null,
  weekStart:null,editWeek:null,
  fl:{etapa:"atual",trilha:"todas",status:"todas"},
  nf:{q:"",tipo:"todos",livro:"todos",topico:"todos"},
  draft:null,preview:false,saveState:"",cdraft:null,csave:"",cq:"",cnq:"",bq:"",
  pdfTarget:null,pendingRestore:null,noteCtx:null,dirty:false
};

/* =====================================================================
   3. Utilidades
   ===================================================================== */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseISO(s){const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function fmtDM(d){return d.getDate()+" "+MESES[d.getMonth()]}
function fmtHM(min){min=Number(min)||0;const h=Math.floor(min/60),m=min%60;return m?(h?h+"h"+pad(m):m+"min"):h+"h"}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function strip(o){const c={...o};delete c.id;return c}
function dis(){return S.offline||S.readOnly?" disabled":""}
function plural(n,um,varios){return n+" "+(n===1?um:varios)}
function toast(msg,ms){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||3400)}
function inline(s){return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<em>$2</em>")}
function md(src){
  const lines=esc(src||"").split("\n");let out="",para=[],list=false;
  const flush=()=>{if(para.length){out+="<p>"+inline(para.join("<br>"))+"</p>";para=[]}};
  const endList=()=>{if(list){out+="</ul>";list=false}};
  for(const raw of lines){
    const l=raw.trimEnd();
    if(/^##\s+/.test(l)){flush();endList();out+="<h4>"+inline(l.replace(/^##\s+/,""))+"</h4>";continue}
    if(/^#\s+/.test(l)){flush();endList();out+="<h3>"+inline(l.replace(/^#\s+/,""))+"</h3>";continue}
    if(/^&gt;\s?/.test(l)){flush();endList();out+="<blockquote>"+inline(l.replace(/^&gt;\s?/,""))+"</blockquote>";continue}
    if(/^[-*]\s+/.test(l)){flush();if(!list){out+="<ul>";list=true}out+="<li>"+inline(l.replace(/^[-*]\s+/,""))+"</li>";continue}
    if(!l.trim()){flush();endList();continue}
    endList();para.push(l);
  }
  flush();endList();return out||'<p class="muted">Nada escrito ainda.</p>';
}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copiado.")}catch(e){toast("Não foi possível copiar neste navegador.")}}
function confirmar(el,rotulo,acao){
  if(el.dataset.confirm!=="1"){const orig=el.textContent;el.dataset.confirm="1";el.textContent=rotulo||"Confirmar";setTimeout(()=>{if(el.isConnected){el.dataset.confirm="";el.textContent=orig}},4500);return}
  acao();
}

/* =====================================================================
   4. Gravação no banco (uma escrita por documento por vez)
   ===================================================================== */
const filas={};
function enfileirar(path,fn){const p=(filas[path]||Promise.resolve()).then(fn,fn);filas[path]=p.catch(()=>{});return p}
async function comRetentativa(fn){try{return await fn()}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));return fn()}throw e}}
function erroDeEscrita(e){
  if(e&&e.code==="invalid_argument"){S.readOnly=true;toast("Não foi possível salvar: este caderno só aceita edições do dono.")}
  else if(e&&e.code==="quota_exceeded")toast("O armazenamento do caderno está cheio. Exclua itens antigos para continuar.");
  else toast("Não foi possível salvar agora. Tente de novo em instantes.");
}
function save(path,data){
  if(!S.db){toast("Sem conexão com o armazenamento.");return Promise.reject({code:"unavailable"})}
  return enfileirar(path,()=>comRetentativa(()=>S.db.doc(path).set(data))).catch(e=>{erroDeEscrita(e);throw e});
}
function remove(path){
  if(!S.db)return Promise.reject({code:"unavailable"});
  return enfileirar(path,()=>comRetentativa(()=>S.db.doc(path).delete())).catch(e=>{erroDeEscrita(e);throw e});
}
const novoId=col=>S.db.collection(col).doc().id;

/* =====================================================================
   5. Regras do plano (configuração, trilhas, ciclos, semanas)
   ===================================================================== */
const cfg=()=>S.cfg||{};
const etapaAtual=()=>Number(cfg().etapaAtual)||1;
function etapaLabel(n){return Number(n)===0?"Consulta":"Ciclo "+n}
function ciclosNums(){const e=(cfg().etapas||[]).map(x=>Number(x.n)).filter(n=>n>0).sort((a,b)=>a-b);return e.length?e:[1,2,3,4]}
function cicloAtualInfo(){return (cfg().etapas||[]).find(x=>Number(x.n)===etapaAtual())}
function trilhas(){const t=cfg().trilhas;return Array.isArray(t)&&t.length?t:DEFAULT_TRILHAS}
function bookTrilhas(){return trilhas().map(x=>x.id)}
function slotTrilhas(){return [...bookTrilhas(),"rotativo","sintese"]}
function T(id){
  const t=trilhas().find(x=>x.id===id);
  if(t)return {nome:t.nome,curto:t.curto||t.nome,cor:"var(--t-"+(CORES[t.cor]?t.cor:"rotativo")+")"};
  if(ESPECIAIS[id])return ESPECIAIS[id];
  return {nome:"Trilha removida",curto:"Sem trilha",cor:"var(--t-rotativo)"};
}
function rotacao(){const r=cfg().rotacao;return Array.isArray(r)&&r.length?r:DEFAULT_ROTACAO}
function weekIndex(ws){if(!cfg().inicioEtapa)return null;return Math.round((ws-mondayOf(parseISO(cfg().inicioEtapa)))/(7*864e5))+1}
function rotIndex(N){return (N&&N>0)?(N-1)%rotacao().length:0}
function resolveTrilha(t,N){return t==="rotativo"?rotacao()[rotIndex(N)]:t}
function legenda(){return {...DEFAULT_LEGENDA,...(cfg().legendaCores||{})}}
function slotsPadrao(){return cfg().semana||DEFAULT_SEMANA}
function slotsDaSemana(){return (S.semanaDoc&&S.semanaDoc.slots)||slotsPadrao()}
const semanaPath=()=>"semanas/"+iso(S.weekStart);
const wk=()=>S.semanaDoc||{};
function salvarSemana(mut){const d=clone(wk());mut(d);return save(semanaPath(),d)}
function irParaSemana(ws){
  if(S.weekStart&&iso(S.weekStart)===iso(ws))return;
  S.weekStart=ws;S.editWeek=null;
  if(S.unsubSemana){S.unsubSemana();S.unsubSemana=null}
  S.semanaDoc=null;
  if(S.db)S.unsubSemana=S.db.doc(semanaPath()).onSnapshot(s=>{S.semanaDoc=s.exists?s.data():null;agendarRender()},()=>{});
}

/* ---------- livros ---------- */
function livro(id){return S.livros.find(b=>b.id===id)}
function byOrdem(a,b){return ((a.etapa||0)-(b.etapa||0))||((a.ordem||0)-(b.ordem||0))||String(a.titulo).localeCompare(String(b.titulo),"pt")}
function livrosOrdenados(){return S.livros.slice().sort((a,b)=>bookTrilhas().indexOf(a.trilha)-bookTrilhas().indexOf(b.trilha)||byOrdem(a,b))}
function emLeitura(t){
  const lendo=S.livros.filter(b=>b.trilha===t&&b.status==="lendo"&&!b.extraData&&!b.topicoId).sort(byOrdem);
  if(lendo.length)return {lendo};
  const prox=S.livros.filter(b=>b.trilha===t&&b.status==="fila"&&!b.extraData&&!b.topicoId&&Number(b.etapa)===etapaAtual()).sort(byOrdem)[0];
  return {lendo:[],prox};
}
function proximoLivro(b){
  if(b.topicoId)return S.livros.filter(x=>x.id!==b.id&&x.topicoId===b.topicoId&&x.status==="fila"&&!x.extraData).sort(byOrdem)[0]||null;
  const pool=S.livros.filter(x=>x.id!==b.id&&x.trilha===b.trilha&&x.status==="fila"&&!x.extraData&&!x.topicoId&&x.tipo!=="opcional"&&Number(x.etapa)>0);
  return pool.filter(x=>Number(x.etapa)===Number(b.etapa)).sort(byOrdem)[0]||pool.filter(x=>Number(x.etapa)>Number(b.etapa)).sort(byOrdem)[0]||null;
}
async function mudarStatusLivro(b,status){
  const data={...strip(b),status};
  if(status==="concluido"&&Number(b.paginasTotal))data.paginasLidas=Number(b.paginasTotal);
  await save("livros/"+b.id,data);
  if(status!=="concluido"||b.status==="concluido"||b.extraData)return;
  const n=proximoLivro(b);
  if(n){await save("livros/"+n.id,{...strip(n),status:"lendo"});toast("Concluído. Próxima leitura: "+n.titulo+(Number(n.etapa)!==Number(b.etapa)?" (já do "+etapaLabel(n.etapa)+")":"")+".")}
  else toast(b.topicoId?"Concluído. Não há outro texto na fila deste tópico.":"Concluído. Não há mais textos na fila desta trilha.");
}
function moverLivro(id,dir){
  const b=livro(id);if(!b)return;
  const mesmo=x=>x.trilha===b.trilha&&(x.topicoId||"")===(b.topicoId||"");
  const g=S.livros.filter(x=>mesmo(x)&&Number(x.etapa)===Number(b.etapa)).sort(byOrdem);
  const i=g.findIndex(x=>x.id===id),o=g[i+dir];
  if(!o){
    const cs=ciclosNums(),k=cs.indexOf(Number(b.etapa)),t=k<0?undefined:cs[k+dir];
    if(t==null){toast(dir<0?"Já é o primeiro texto.":"Já é o último texto.");return}
    const tg=S.livros.filter(x=>mesmo(x)&&Number(x.etapa)===t).map(x=>Number(x.ordem)||0);
    const ordem=dir<0?(tg.length?Math.max(...tg)+10:10):(tg.length?Math.min(...tg)-10:10);
    save("livros/"+b.id,{...strip(b),etapa:t,ordem}).then(()=>toast("Movido para o "+etapaLabel(t)+".")).catch(()=>{});return;
  }
  let oa=Number(b.ordem)||0,ob=Number(o.ordem)||0;if(oa===ob)ob=oa+dir;
  save("livros/"+b.id,{...strip(b),ordem:ob}).then(()=>save("livros/"+o.id,{...strip(o),ordem:oa})).catch(()=>{});
}
function mudarCicloLivro(b,n){
  const ordem=Math.max(0,...S.livros.filter(x=>x.trilha===b.trilha&&Number(x.etapa)===n).map(x=>Number(x.ordem)||0))+10;
  save("livros/"+b.id,{...strip(b),etapa:n,ordem}).then(()=>toast("Movido para "+(n?"o ":"")+etapaLabel(n)+".")).catch(()=>{});
}
async function excluirTexto(id){
  const b=livro(id);
  await remove("livros/"+id);
  const partes=[];let falhou=false;
  if(b&&b.pdfId&&!S.livros.some(x=>x.id!==id&&x.pdfId===b.pdfId)&&S.assets){
    try{await S.assets.delete(b.pdfId);partes.push("o PDF")}catch(e){falhou=true}
  }
  try{const q=await S.db.collection("anot").where("livroId","==",id).get();for(const d of q.docs)await remove("anot/"+d.id);if(q.size)partes.push("as marcações")}catch(e){}
  toast("Texto excluído"+(partes.length?", com "+partes.join(" e "):"")+(falhou?" (o PDF não pôde ser apagado)":"")+". Fichamentos e sínteses continuam salvos.");
}

/* ---------- tópicos ---------- */
function topico(id){return S.topicos.find(x=>x.id===id)}
function byOrdemT(a,b){return ((a.ordem||0)-(b.ordem||0))||String(a.nome).localeCompare(String(b.nome),"pt")}
const topTrilha=tp=>tp.trilha||"livres";
function topicosDe(t){return S.topicos.filter(x=>topTrilha(x)===t)}
function topicosAtivos(t){return topicosDe(t).filter(x=>x.status==="lendo").sort(byOrdemT)}
function textosDoTopico(tp){return S.livros.filter(b=>b.topicoId===tp.id).sort((a,b)=>((ORD_ST[a.status]??4)-(ORD_ST[b.status]??4))||byOrdem(a,b))}
function notasDoTopico(tp){const ids=new Set(textosDoTopico(tp).map(b=>b.id));return S.notas.filter(n=>n.topicoId===tp.id||(n.livroId&&ids.has(n.livroId))).sort((a,b)=>String(b.atualizado||"").localeCompare(String(a.atualizado||"")))}
async function mudarStatusTopico(tp,status){
  const antes=tp.status;
  await save("topicos/"+tp.id,{...strip(tp),status});
  if(status==="concluido"&&antes!=="concluido"){
    const n=topicosDe(topTrilha(tp)).filter(x=>x.id!==tp.id&&x.status==="fila").sort(byOrdemT)[0];
    if(n){await save("topicos/"+n.id,{...strip(n),status:"lendo"});toast("Tópico concluído. Próximo: "+n.nome+".")}
    else toast("Tópico concluído. Não há outro tópico na fila desta trilha.");
  }
}
function moverTopico(id,dir){
  const tp=topico(id);if(!tp)return;
  const g=S.topicos.filter(x=>(x.eixo||"")===(tp.eixo||"")).sort(byOrdemT);
  const i=g.findIndex(x=>x.id===id),o=g[i+dir];if(!o)return;
  let oa=Number(tp.ordem)||0,ob=Number(o.ordem)||0;if(oa===ob)ob=oa+dir;
  save("topicos/"+tp.id,{...strip(tp),ordem:ob}).then(()=>save("topicos/"+o.id,{...strip(o),ordem:oa})).catch(()=>{});
}

/* ---------- notas ---------- */
const ehEscrito=tipo=>ESCRITOS.includes(tipo);
const tiposDe=modo=>Object.keys(TIPOS_NOTA).filter(t=>ehEscrito(t)===(modo==="sinteses"));
function textoSintese(){
  const desde=Date.now()-28*864e5;
  const recentes=S.notas.filter(n=>!ehEscrito(n.tipo)&&n.atualizado&&new Date(n.atualizado).getTime()>=desde).sort((a,b)=>String(a.criado||a.atualizado).localeCompare(String(b.criado||b.atualizado)));
  return (cfg().modeloSintese||DEFAULT_MODELO_SINTESE).trim()+"\n\n## Fichamentos das últimas 4 semanas\n"
    +(recentes.length?recentes.map(n=>{const b=livro(n.livroId);return "- "+(n.titulo||"Sem título")+(b?" ("+b.titulo+")":"")}).join("\n"):"- Nenhum fichamento nas últimas 4 semanas.")+"\n";
}
function notaTexto(n){const b=livro(n.livroId),ar=n.artigoId&&S.artigos.find(x=>x.id===n.artigoId);return "# "+(n.titulo||"Sem título")+"\n"+(TIPOS_NOTA[n.tipo]||"")+(b?" — "+b.titulo+(b.autor?" ("+b.autor+")":""):"")+(ar?" — "+ar.titulo+(ar.link?" ("+ar.link+")":""):"")+(n.paginas?" — p. "+n.paginas:"")+"\n\n"+(n.texto||"")+"\n"}

/* ---------- revisão espaçada ---------- */
function hashStr(t){let h=7;for(const ch of t)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)}
function revisaoItens(){
  const limite=Date.now()-14*864e5,chave=iso(S.weekStart||new Date()),velho=x=>x.atualizado&&new Date(x.atualizado).getTime()<limite;
  const pool=[...S.notas.filter(n=>!ehEscrito(n.tipo)&&velho(n)).map(x=>({k:"n",x})),...S.conceitos.filter(velho).map(x=>({k:"c",x}))];
  return pool.sort((a,b)=>hashStr(chave+a.x.id)-hashStr(chave+b.x.id)).slice(0,3);
}

/* ---------- ciclos ---------- */
function lerCiclosDoFormulario(){
  return (cfg().etapas||[]).map(x=>{const t=$("et-t-"+x.n),o=$("et-o-"+x.n);return {...x,titulo:t?t.value:x.titulo,objetivo:o?o.value:x.objetivo}});
}
async function remapearCiclos(etapas,map,msg){
  const next=clone(cfg());next.etapas=etapas;next.etapaAtual=map(etapaAtual())||1;
  try{await save("plano/config",next)}catch(e){return}
  for(const b of S.livros.filter(b=>Number(b.etapa)>0&&map(Number(b.etapa))!==Number(b.etapa))){try{await save("livros/"+b.id,{...strip(b),etapa:map(Number(b.etapa))})}catch(e){return}}
  toast(msg);
}
function salvarConfig(next,msg){return save("plano/config",next).then(()=>{if(msg)toast(msg)}).catch(()=>{})}

/* =====================================================================
   6. Blocos de estudo (usados em Hoje e Semana)
   ===================================================================== */
function btnAbrir(b,rotulo){return b.pdfId?'<button class="btn sm" data-act="ler" data-id="'+b.id+'">'+(rotulo||"Abrir texto")+'</button>':''}
function linhaLivro(b,comLido){
  return '<div class="tt">'+esc(b.titulo)+'</div>'+(b.foco?'<div class="sub">'+esc(b.foco)+'</div>':'')
    +'<div class="row">'+btnAbrir(b)+(comLido?'<button class="btn sm ghost" data-act="livro-lido" data-id="'+b.id+'"'+dis()+'>Marcar como lido</button>':'')+'</div>';
}
function revisaoHtml(){
  const l=revisaoItens();
  if(!l.length)return '<div class="sub">Revisão: ainda não há fichamentos ou conceitos com mais de duas semanas.</div>';
  return '<div class="sub"><strong>Revise antes de escrever:</strong></div>'+l.map(it=>it.k==="c"
    ?'<button class="item" data-act="conceito-ir" data-id="'+it.x.id+'"><span class="tt">'+esc(it.x.termo)+'</span><span class="sub">'+(ehNome(it.x)?"Nome":"Conceito")+'</span></button>'
    :'<button class="item" style="--c:'+T(it.x.trilha).cor+'" data-act="nota-ir" data-id="'+it.x.id+'"><span class="tt">'+esc(it.x.titulo||"Sem título")+'</span><span class="sub">'+(TIPOS_NOTA[it.x.tipo]||"")+(livro(it.x.livroId)?" · "+esc(livro(it.x.livroId).titulo):"")+'</span></button>').join("");
}
function conteudoTrilha(t){
  if(t==="sintese")return '<div class="tt">Escrever 1 a 2 páginas sobre o que leu no mês</div>'+revisaoHtml();
  if(topicosDe(t).length){
    const at=topicosAtivos(t);
    if(!at.length){const p=topicosDe(t).filter(x=>x.status==="fila").sort(byOrdemT)[0];return '<div class="sub">Nenhum tópico em estudo.'+(p?' Próximo: '+esc(p.nome)+'.':'')+'</div>'}
    return at.map(tp=>{
      const ls=textosDoTopico(tp).filter(b=>b.status==="lendo");
      return '<div class="tt"><button class="linkish" data-act="topico-abrir" data-id="'+tp.id+'">'+esc(tp.nome)+'</button> <span class="pill">tópico</span></div>'
        +(ls.length?ls.map(b=>'<div class="sub">'+esc(b.titulo)+(b.autor?' — '+esc(b.autor):'')+' '+btnAbrir(b)+'</div>').join(""):'<div class="sub">Nenhum texto escolhido ainda para este tópico.</div>');
    }).join("");
  }
  const a=emLeitura(t);
  if(a.lendo.length)return a.lendo.map(b=>linhaLivro(b,true)).join("");
  if(a.prox)return '<div class="sub">Nada marcado como “Lendo”. Próximo do ciclo: '+esc(a.prox.titulo)+'</div>';
  return '<div class="sub">Nenhum texto em leitura nesta trilha.</div>';
}
function checkBtn(key,ok){return '<button class="check" data-act="bloco-feito" data-key="'+key+'" aria-pressed="'+ok+'" aria-label="Marcar como feito"'+dis()+'>'+(ok?CHECK_SVG:"")+'</button>'}
function blocoSlot(d,s,N){
  const w=wk(),key=d.i+":"+s.id,ok=!!(w.feitos||{})[key],sk=!!(w.pulados||{})[key];
  const t=resolveTrilha(s.trilha,N),tb=(w.trocas||{})[key]?livro(w.trocas[key]):null,tc=tb?tb.trilha:t;
  let lab=esc(T(tc).curto);
  if(tb&&tb.trilha!==t)lab+=' <span class="n">(no lugar de '+esc(T(t).curto)+')</span>';
  else if(s.trilha==="rotativo")lab+=' <span class="n">(sexta rotativa, '+(rotIndex(N)+1)+' de '+rotacao().length+')</span>';
  lab+=' · '+fmtHM(s.min)+(sk?' · <span class="miss">não estudado</span>':'');
  const corpo=tb?linhaLivro(tb,true).replace('<div class="row">','<div class="row"><span class="pill soft">Troca só neste dia</span>'):conteudoTrilha(t);
  return '<div class="strip'+(ok?" done":"")+(sk?" skipped":"")+'" style="--c:'+T(tc).cor+'"><div class="body"><div class="lab">'+lab+'</div>'+corpo+'</div>'
    +'<div class="acts">'+checkBtn(key,ok)+'<button class="btn more ghost" data-act="bloco-menu" data-key="'+key+'" data-trilha="'+t+'" aria-label="Mais ações">⋯</button></div></div>';
}
function blocoExtra(b){
  const w=wk(),key="x:"+b.id,ok=!!(w.feitos||{})[key],sk=!!(w.pulados||{})[key];
  return '<div class="strip'+(ok?" done":"")+(sk?" skipped":"")+'" style="--c:'+T(b.trilha).cor+'"><div class="body"><div class="lab">Extraordinária'+(b.extraPeriodo?' · '+esc(b.extraPeriodo):'')+' · '+fmtHM(b.extraMin||60)+(sk?' · <span class="miss">não estudado</span>':'')+'</div>'
    +'<div class="tt">'+esc(b.titulo)+'</div>'+((b.autor||b.foco)?'<div class="sub">'+esc([b.autor,b.foco].filter(Boolean).join(" — "))+'</div>':'')+(b.pdfId?'<div class="row">'+btnAbrir(b)+'</div>':'')+'</div>'
    +'<div class="acts">'+checkBtn(key,ok)+'<button class="btn more ghost" data-act="bloco-menu" data-key="'+key+'" data-livro="'+b.id+'" aria-label="Mais ações">⋯</button></div></div>';
}
function rodapeDia(d,keys,rotulo){
  if(!keys.length)return "";
  const p=wk().pulados||{},todos=keys.every(k=>p[k]),algum=keys.some(k=>p[k]);
  return '<div class="day-foot"><button class="btn sm'+(todos?"":" ghost")+'" data-act="dia-pular" data-keys="'+keys.join(",")+'"'+dis()+'>'+(todos?"Desfazer: estudei":rotulo)+'</button>'
    +(algum?'<input type="text" class="motivo" data-dia="'+d.i+'" placeholder="Motivo (opcional)" aria-label="Motivo de não ter estudado" value="'+esc((wk().motivos||{})[d.i]||"")+'">':'')+'</div>';
}
function blocosDoDia(d,date,N){
  const extras=S.livros.filter(b=>b.extraData===iso(date)).sort(byOrdem),slots=slotsDaSemana()[d.i]||[];
  return {extras,slots,keys:[...extras.map(b=>"x:"+b.id),...slots.map(s=>d.i+":"+s.id)],min:slots.reduce((a,s)=>a+(Number(s.min)||0),0)+extras.reduce((a,b)=>a+(Number(b.extraMin)||60),0)};
}
function blocosDaSemana(){
  const N=weekIndex(S.weekStart),w=wk(),out=[];
  DIAS.forEach((d,k)=>(slotsDaSemana()[d.i]||[]).forEach(s=>{
    const key=d.i+":"+s.id,t=resolveTrilha(s.trilha,N),a=t==="sintese"?{lendo:[]}:emLeitura(t),padrao=a.lendo[0]||a.prox||null;
    const atual=(w.trocas||{})[key]&&livro(w.trocas[key])?livro(w.trocas[key]):padrao;
    out.push({key,dia:d,date:addDays(S.weekStart,k),t,padrao,atual});
  }));
  return out;
}

/* ---------- Hoje ---------- */
const TM={fase:"",fim:0,resto:0,pausado:false,foco:25,iv:null};
function fmtClock(ms){const t=Math.max(0,Math.round(ms/1000));return pad(Math.floor(t/60))+":"+pad(t%60)}
const tmResto=()=>TM.pausado?TM.resto:TM.fim-Date.now();
function timerHtml(){
  if(!TM.fase){const op=opcoesDoCronometro();S.tmOpcoes=op;return '<label class="small muted" for="tm-alvo">Estudar:</label><select id="tm-alvo" style="max-width:220px">'+op.map((o,i)=>'<option value="'+i+'">'+esc(o.rotulo)+'</option>').join("")+'</select><button class="btn sm" data-act="tm-iniciar" data-min="25">25 min</button><button class="btn sm" data-act="tm-iniciar" data-min="50">50 min</button>'}
  return '<strong class="clock hours" id="tm-clock">'+fmtClock(tmResto())+'</strong><span class="pill'+(TM.fase==="foco"?" hot":"")+'">'+(TM.fase==="foco"?"Foco":"Pausa")+'</span>'
    +(TM.alvo&&TM.fase==="foco"?'<span class="small muted">'+esc(TM.alvo.rotulo)+'</span>':'')+'<button class="btn sm" data-act="tm-pausar">'+(TM.pausado?"Continuar":"Pausar")+'</button><button class="btn sm ghost" data-act="tm-encerrar">Encerrar</button>';
}
function telaHoje(){
  const hoje=new Date();irParaSemana(mondayOf(hoje));
  const N=weekIndex(S.weekStart),d=DIAS.find(x=>x.i===hoje.getDay()),bl=blocosDoDia(d,hoje,N),hr=(cfg().horarios||{})[d.i];
  let h='<section class="card"><div class="spread"><div><div class="small muted">'+d.nome+', '+hoje.getDate()+' de '+MESES_LONGOS[hoje.getMonth()]+(hr?' · '+esc(hr):'')+'</div><h2>Hoje</h2></div>'
   +'<div class="row" id="timer-box">'+timerHtml()+'</div></div><div class="small muted">Estudado nesta semana: '+fmtHM(minutosCronometrados(mondayOf(hoje)))+' · <a href="#historico">Histórico</a></div></section>';
  if(!bl.keys.length){
    let prox=null;for(let k=1;k<=7&&!prox;k++){const dt=addDays(hoje,k),l=slotsPadrao()[dt.getDay()]||[];if(l.length)prox={dt,l}}
    return h+avulsasDeHoje()+'<div class="empty">Hoje não há estudo planejado.'+(prox?'<br><span class="small">Próximo: '+DIAS.find(x=>x.i===prox.dt.getDay()).nome+', '+prox.l.map(s=>esc(T(resolveTrilha(s.trilha,weekIndex(mondayOf(prox.dt)))).curto)).join(" + ")+'.</span>':'')+'</div>'+imprensaDoDia();
  }
  return h+'<section class="day today" aria-label="Blocos de hoje">'+bl.extras.map(blocoExtra).join("")+bl.slots.map(s=>blocoSlot(d,s,N)).join("")+rodapeDia(d,bl.keys,"Não estudei hoje")+'</section>'+avulsasDeHoje()+imprensaDoDia();
}

/* ---------- Semana ---------- */
function telaSemana(){
  if(!S.weekStart)irParaSemana(mondayOf(new Date()));
  const ws=S.weekStart,N=weekIndex(ws),editando=!!S.editWeek,w=wk(),hoje=iso(new Date());
  let plano=0,feito=0,falta=0;
  DIAS.forEach((d,k)=>{const bl=blocosDoDia(d,addDays(ws,k),N);
    bl.slots.forEach(s=>{const key=d.i+":"+s.id,m=Number(s.min)||0;plano+=m;if((w.feitos||{})[key])feito+=m;if((w.pulados||{})[key])falta+=m});
    bl.extras.forEach(b=>{const key="x:"+b.id,m=Number(b.extraMin)||60;plano+=m;if((w.feitos||{})[key])feito+=m;if((w.pulados||{})[key])falta+=m});
  });
  const info=cicloAtualInfo(),pct=plano?Math.round(feito/plano*100):0;
  const semLabel=N==null?"defina o início do ciclo em Plano":N<1?"o ciclo começa em "+fmtDM(parseISO(cfg().inicioEtapa)):"semana "+N+" do ciclo";
  const agora=bookTrilhas().map(t=>{
    let txt;
    if(topicosDe(t).length){const at=topicosAtivos(t);txt=at.length?at.map(x=>esc(x.nome)).join(" · "):'<span class="muted">Nenhum tópico em estudo</span>'}
    else{const a=emLeitura(t);txt=a.lendo.length?a.lendo.map(b=>esc(b.titulo)).join(" · "):(a.prox?'<span class="muted">Próximo: '+esc(a.prox.titulo)+'</span>':'<span class="muted">—</span>')}
    return '<div class="now" style="--c:'+T(t).cor+'"><div class="lab">'+esc(T(t).curto)+'</div><div class="tt" style="font-size:14px">'+txt+'</div></div>';
  }).join("");
  let h='<section class="card"><div class="spread"><div><div class="small muted">'+etapaLabel(etapaAtual())+' · '+esc(semLabel)+'</div><h2>'+esc(info?info.titulo:"Plano de estudos")+'</h2></div>'
   +'<div style="min-width:190px"><div class="spread small"><span>Horas feitas</span><strong class="hours">'+fmtHM(feito)+' / '+fmtHM(plano)+'</strong></div><div class="meter" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+pct+'%"></span></div>'+(falta?'<div class="small miss" style="margin-top:4px">Não estudado: '+fmtHM(falta)+'</div>':'')+'<div class="small muted" style="margin-top:4px">Tempo registrado: '+fmtHM(minutosCronometrados(ws))+' · <a href="#historico">Histórico</a></div></div></div>'
   +'<div class="now-grid">'+agora+'</div></section>';
  h+='<div class="spread"><div class="weeknav"><button class="btn" data-act="sem-ant" aria-label="Semana anterior">‹</button><span class="range">'+fmtDM(ws)+' – '+fmtDM(addDays(ws,6))+'</span><button class="btn" data-act="sem-prox" aria-label="Próxima semana">›</button><button class="btn ghost" data-act="sem-hoje">Hoje</button></div>'
   +(editando?'':'<div class="row">'+(w.slots?'<span class="pill">Semana ajustada</span>':'')+'<button class="btn" data-act="avulsa-nova"'+dis()+'>+ Leitura fora do horário</button><button class="btn" data-act="extra-novo"'+dis()+'>+ Leitura extraordinária</button><button class="btn" data-act="sem-editar"'+dis()+'>Reorganizar</button></div>')+'</div>';
  if(editando)h+='<div class="editbar"><span class="small"><strong>Reorganizando.</strong> Mude a trilha, a duração ou o dia de cada bloco.</span><button class="btn primary" data-act="sem-salvar">Salvar só nesta semana</button><button class="btn" data-act="sem-padrao">Salvar como padrão</button>'+(w.slots?'<button class="btn" data-act="sem-reset">Voltar ao padrão</button>':'')+'<button class="btn ghost" data-act="sem-cancelar">Cancelar</button></div>';
  h+='<div class="days">';
  DIAS.forEach((d,k)=>{
    const date=addDays(ws,k),bl=blocosDoDia(d,date,N),eHoje=iso(date)===hoje,hr=(cfg().horarios||{})[d.i];
    h+='<section class="day'+(eHoje?" today":"")+'" aria-label="'+d.nome+'"><div class="day-h"><h3>'+d.nome+' <span class="small muted">'+fmtDM(date)+(hr?' · '+esc(hr):'')+'</span></h3>'+(eHoje?'<span class="pill hot">Hoje</span>':'<span class="pill">'+fmtHM(bl.min)+'</span>')+'</div>';
    if(editando){
      (S.editWeek[d.i]||[]).forEach((s,idx)=>{
        h+='<div class="strip edit" style="--c:'+T(s.trilha).cor+'">'
          +'<select aria-label="Trilha" data-act="slot-trilha" data-dia="'+d.i+'" data-idx="'+idx+'">'+slotTrilhas().map(t=>'<option value="'+t+'"'+(t===s.trilha?" selected":"")+'>'+esc(T(t).curto)+'</option>').join("")+'</select>'
          +'<select aria-label="Duração" data-act="slot-min" data-dia="'+d.i+'" data-idx="'+idx+'">'+[30,45,60,90,120].map(m=>'<option value="'+m+'"'+(m===Number(s.min)?" selected":"")+'>'+fmtHM(m)+'</option>').join("")+'</select>'
          +'<select aria-label="Mover para" data-act="slot-dia" data-dia="'+d.i+'" data-idx="'+idx+'">'+DIAS.map(x=>'<option value="'+x.i+'"'+(x.i===d.i?" selected":"")+'>'+x.c+'</option>').join("")+'</select>'
          +'<button class="btn sm ghost" data-act="slot-remover" data-dia="'+d.i+'" data-idx="'+idx+'">Remover</button></div>';
      });
      h+='<button class="btn sm" data-act="slot-adicionar" data-dia="'+d.i+'">+ Adicionar bloco</button>';
    }else{
      if(!bl.keys.length)h+='<div class="sub">Sem estudo neste dia.</div>';
      h+=bl.extras.map(blocoExtra).join("")+bl.slots.map(s=>blocoSlot(d,s,N)).join("")+rodapeDia(d,bl.keys,"Não estudei neste dia");
    }
    h+='</section>';
  });
  return h+'</div>';
}

/* ---------- Biblioteca ---------- */
function telaBiblioteca(){
  const seg='<div class="spread"><div class="seg" role="group" aria-label="Biblioteca"><button data-act="bib-aba" data-tab="textos" aria-pressed="'+(S.bibTab==="textos")+'">Textos</button><button data-act="bib-aba" data-tab="topicos" aria-pressed="'+(S.bibTab==="topicos")+'">Tópicos</button><button data-act="bib-aba" data-tab="imprensa" aria-pressed="'+(S.bibTab==="imprensa")+'">Imprensa'+(S.artigos.some(a=>a.status!=="lido")?' <span class="pill hot">'+S.artigos.filter(a=>a.status!=="lido").length+'</span>':'')+'</button></div>'
   +(S.bibTab==="textos"?'<button class="btn primary" data-act="livro-novo"'+dis()+'>+ Adicionar texto</button>':S.bibTab==="imprensa"?'<button class="btn" data-act="artigo-novo"'+dis()+'>+ Matéria</button>':(S.topicoAberto?'':'<button class="btn primary" data-act="topico-novo"'+dis()+'>+ Novo tópico</button>'))+'</div>';
  if(S.bibTab==="imprensa")return seg+telaImprensa();
  if(S.bibTab==="topicos"){
    const tp=S.topicoAberto&&topico(S.topicoAberto);
    if(S.topicoAberto&&!tp)S.topicoAberto=null;
    return seg+(tp?telaPasta(tp):telaTopicos());
  }
  return seg+telaTextos();
}
function selectStatus(b,act,mapa){return '<select class="mini st-'+esc(b.status)+'" style="--c:'+T(b.trilha||topTrilha(b)).cor+'" aria-label="Status" data-act="'+act+'" data-id="'+b.id+'"'+dis()+'>'+Object.keys(mapa).map(k=>'<option value="'+k+'"'+(k===b.status?" selected":"")+'>'+mapa[k]+'</option>').join("")+'</select>'}
function cartaoLivro(b){
  const tot=Number(b.paginasTotal)||0,lid=Math.min(Number(b.paginasLidas)||0,tot||Infinity),tp=b.topicoId&&topico(b.topicoId);
  const ciclos=[0,...ciclosNums()];if(!ciclos.includes(Number(b.etapa)))ciclos.push(Number(b.etapa));
  return '<article class="book '+esc(b.status)+'" style="--c:'+T(b.trilha).cor+'"><div><div class="tt">'+esc(b.titulo)+'</div><div class="sub">'+esc(b.autor||"")+'</div>'
    +'<div class="meta" style="margin-top:4px"><select class="mini" aria-label="Ciclo" data-act="livro-ciclo" data-id="'+b.id+'"'+dis()+'>'+ciclos.map(n=>'<option value="'+n+'"'+(n===Number(b.etapa)?" selected":"")+'>'+etapaLabel(n)+'</option>').join("")+'</select>'
    +(b.mes?'<span class="pill">mês '+esc(b.mes)+'</span>':'')+(b.tipo&&b.tipo!=="principal"?'<span class="pill">'+esc(TIPOS_LIVRO[b.tipo]||b.tipo)+'</span>':'')
    +(tp?'<button class="pill linkish" data-act="topico-abrir" data-id="'+tp.id+'">Tópico: '+esc(tp.nome)+'</button>':'')
    +(b.extraData?'<span class="pill soft">Extraordinária · '+fmtDM(parseISO(b.extraData))+'</span>':'')+(b.pdfId?'<span class="pill">PDF</span>':'')+'</div></div>'
    +'<div class="side">'+selectStatus(b,"livro-status",STATUS)+'<div class="row">'+(b.pdfId?'<button class="btn sm primary" data-act="ler" data-id="'+b.id+'">Ler</button>':'')+'<button class="btn more ghost" data-act="livro-menu" data-id="'+b.id+'" aria-label="Mais ações">⋯</button></div></div>'
    +(b.foco?'<div class="sub full">'+esc(b.foco)+'</div>':'')
    +(tot?'<div class="prog full"><div class="meter"><span style="width:'+Math.round(lid/tot*100)+'%"></span></div>'+lid+' / '+tot+' p.</div>':'')+'</article>';
}
function telaTextos(){
  const f=S.fl,et=f.etapa==="atual"?etapaAtual():f.etapa;
  const opt=(id,val,lista)=>'<select id="'+id+'" aria-label="Filtro">'+lista.map(([v,l])=>'<option value="'+v+'"'+(String(v)===String(val)?" selected":"")+'>'+esc(l)+'</option>').join("")+'</select>';
  let h='<div class="filters">'+opt("fl-etapa",f.etapa,[["atual","Ciclo atual ("+etapaAtual()+")"],...ciclosNums().map(n=>[n,"Ciclo "+n]),[0,"Consulta"],["todas","Todos os ciclos"]])
   +opt("fl-trilha",f.trilha,[["todas","Todas as trilhas"],...bookTrilhas().map(t=>[t,T(t).curto])])
   +opt("fl-status",f.status,[["todas","Todos os status"],...Object.keys(STATUS).map(k=>[k,STATUS[k]])])+'</div>';
  if(!S.livros.length)return h+'<div class="empty">Nenhum texto ainda. Use “+ Adicionar texto”.</div>';
  const lista=S.livros.filter(b=>(et==="todas"||Number(b.etapa)===Number(et))&&(f.trilha==="todas"||b.trilha===f.trilha)&&(f.status==="todas"||b.status===f.status));
  let algum=false;
  bookTrilhas().forEach(t=>{
    const g=lista.filter(b=>b.trilha===t).sort(byOrdem);if(!g.length)return;algum=true;
    h+='<section class="group" style="--c:'+T(t).cor+'"><div class="group-h"><h2>'+esc(T(t).nome)+'</h2><span class="pill">'+g.length+'</span></div>'+g.map(cartaoLivro).join("")+'</section>';
  });
  return h+(algum?'':'<div class="empty">Nenhum texto com esses filtros.</div>');
}
function telaTopicos(){
  let h='<p class="small muted">Cada tópico é uma pasta: guarda os textos que você ler sobre o assunto, agora ou no futuro, com fichamentos e sínteses. Os marcados como “Estudando” aparecem no dia da trilha.</p>';
  if(!S.topicos.length)return h+'<div class="empty">Nenhum tópico ainda. Use “+ Novo tópico”.</div>';
  const eixos=[...new Set(S.topicos.map(x=>x.eixo||""))].sort((a,b)=>a===""?1:b===""?-1:a.localeCompare(b,"pt"));
  eixos.forEach(e=>{
    const l=S.topicos.filter(x=>(x.eixo||"")===e).sort((a,b)=>((ORD_ST[a.status]??4)-(ORD_ST[b.status]??4))||byOrdemT(a,b));
    h+='<section class="group"><div class="group-h"><h2>'+(e?esc(e):"Sem eixo")+'</h2><span class="pill">'+l.length+'</span></div>';
    l.forEach(tp=>{

        +'<div class="meta" style="margin-top:4px"><span class="pill">'+plural(nt,"texto","textos")+'</span><span class="pill">'+plural(nn,"anotação","anotações")+'</span></div></div>'
        +'<div class="side"><span class="pill'+(tp.status==="lendo"?" hot":"")+'">'+STATUS_T[tp.status]+'</span><span class="sub">Abrir ›</span></div></button>';
    });

function telaPasta(tp){
  const tr=topTrilha(tp),ls=textosDoTopico(tp),ns=notasDoTopico(tp),fich=ns.filter(n=>!ehEscrito(n.tipo)),sint=ns.filter(n=>ehEscrito(n.tipo));

  let h='<div><button class="btn sm ghost" data-act="topico-fechar">‹ Todos os tópicos</button></div>'
   +'<section class="card" style="--c:'+T(tr).cor+';border-left:4px solid var(--c)"><div class="spread"><div><div class="small muted">'+esc((tp.eixo?tp.eixo+" · ":"")+T(tr).curto)+'</div><h2>'+esc(tp.nome)+'</h2></div>'
   +'<div class="row">'+selectStatus({...tp,trilha:tr},"topico-status",STATUS_T)+'<button class="btn more ghost" data-act="topico-menu" data-id="'+tp.id+'" aria-label="Mais ações">⋯</button></div></div>'
   +(tp.descricao?'<p>'+esc(tp.descricao)+'</p>':'')
   +'<p class="small muted">'+(tp.status==="lendo"?"Está na agenda do dia de "+esc(T(tr).curto)+".":"Fora da agenda. Mude para “Estudando” para aparecer no calendário.")+'</p></section>';
  h+='<section class="card"><div class="spread"><h2>Textos <span class="pill">'+ls.length+'</span></h2><div class="row"><button class="btn sm" data-act="topico-texto" data-id="'+tp.id+'"'+dis()+'>+ Texto</button>'+(S.assets?'<button class="btn sm" data-act="topico-pdf" data-id="'+tp.id+'"'+dis()+'>Importar PDF</button>':'')+'</div></div>'
   +(ls.length?ls.map(b=>'<div class="strip" style="--c:'+T(b.trilha).cor+';align-items:center"><div class="body"><div class="tt">'+esc(b.titulo)+'</div><div class="sub">'+esc(b.autor||"")+(b.paginasTotal?(b.autor?" · ":"")+(Number(b.paginasLidas)||0)+"/"+b.paginasTotal+" p.":"")+'</div></div>'
      +'<div class="row">'+selectStatus(b,"livro-status",STATUS)+(b.pdfId?'<button class="btn sm primary" data-act="ler" data-id="'+b.id+'">Ler</button>':'')+'<button class="btn more ghost" data-act="livro-menu" data-id="'+b.id+'" aria-label="Mais ações">⋯</button></div></div>').join(""):'<p class="small muted">Nenhum texto ainda. O que você ler sobre este assunto, agora ou no futuro, fica guardado aqui.</p>')+'</section>';
  h+='<section class="card"><div class="spread"><h2>Fichamentos <span class="pill">'+fich.length+'</span></h2><button class="btn sm" data-act="topico-anotar" data-id="'+tp.id+'"'+dis()+'>+ Anotar</button></div>'+(fich.length?'<div class="items" style="max-height:none">'+fich.map(item).join("")+'</div>':'<p class="small muted">Nenhum fichamento ainda.</p>')+'</section>';
  h+='<section class="card"><div class="spread"><h2>Sínteses <span class="pill">'+sint.length+'</span></h2><button class="btn sm" data-act="topico-sintese" data-id="'+tp.id+'"'+dis()+'>+ Escrever</button></div>'+(sint.length?'<div class="items" style="max-height:none">'+sint.map(item).join("")+'</div>':'<p class="small muted">Nenhuma síntese sobre este tópico ainda.</p>')+'</section>';
  if(concs.length)h+='<section class="card"><h2>Conceitos ligados</h2><div class="row">'+concs.map(c=>'<button class="chip" data-act="conceito-ir" data-id="'+c.id+'">'+esc(c.termo)+'</button>').join("")+'</div></section>';

/* ---------- Caderno (fichamentos, sínteses, conceitos) ---------- */

  const seg='<div class="seg" role="group" aria-label="Caderno">'+[["tudo","Tudo"],["fichamentos","Fichamentos"],["sinteses","Sínteses"],["conceitos","Conceitos"],["nomes","Nomes"]].map(([k,l])=>'<button data-act="cad-aba" data-tab="'+k+'" aria-pressed="'+(S.cadTab===k)+'">'+l+'</button>').join("")+'</div>';
  return seg+(S.cadTab==="tudo"?telaTudo():S.cadTab==="conceitos"||S.cadTab==="nomes"?telaConceitos():telaNotas());
}
function notasFiltradas(){
  const f=S.nf,q=f.q.trim().toLowerCase(),modo=S.cadTab,tipos=tiposDe(modo);
  return S.notas.filter(n=>ehEscrito(n.tipo)===(modo==="sinteses")&&(!f.artigo||f.artigo==="todos"||n.artigoId===f.artigo)&&(f.topico==="todos"||n.topicoId===f.topico)&&(f.livro==="todos"||n.livroId===f.livro)&&(f.tipo==="todos"||!tipos.includes(f.tipo)||n.tipo===f.tipo)
    &&(!q||(String(n.titulo)+" "+String(n.texto)).toLowerCase().includes(q))).sort((a,b)=>String(b.atualizado||"").localeCompare(String(a.atualizado||"")));
}

  const lista='<div class="list"><div class="spread"><h2>'+(sint?"Sínteses":"Fichamentos")+'</h2><button class="btn primary" data-act="nota-nova"'+dis()+'>+ '+(sint?"Escrever":"Nova")+'</button></div>'

function abrirModal(html){$("modal-root").innerHTML='<div class="overlay" data-act="modal-fundo">'+html+'</div>'}
function fecharModal(){$("modal-root").innerHTML=""}
const modalAberto=()=>!!$("modal-root").innerHTML;
function menu(titulo,itens){
  abrirModal('<div class="dialog" role="dialog" aria-label="'+esc(titulo)+'"><h2>'+esc(titulo)+'</h2><div class="menu-list">'
    +itens.filter(Boolean).map(([act,rot,attrs,cls])=>'<button class="btn'+(cls?" "+cls:"")+'" data-act="'+act+'" '+(attrs||"")+'>'+rot+'</button>').join("")
    +'</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="modal-fechar">Fechar</button></div></div>');
}
const attr=o=>Object.entries(o).map(([k,v])=>'data-'+k+'="'+esc(v)+'"').join(" ");

/* ---------- ações de um bloco do calendário ---------- */
function menuBloco(el){
  const key=el.dataset.key,w=wk(),sk=!!(w.pulados||{})[key];
  if(el.dataset.livro){
    const b=livro(el.dataset.livro);if(!b)return;
    menu(b.titulo,[["bloco-pular",sk?"Desfazer “não consegui”":"Não consegui estudar",attr({key})],b.pdfId&&["ler","Abrir texto",attr({id:b.id})],["anotar-livro","Anotar",attr({id:b.id})],["livro-editar","Editar a leitura",attr({id:b.id})]]);
    return;
  }
  const t=el.dataset.trilha,trocado=!!(w.trocas||{})[key],tb=trocado&&livro(w.trocas[key]);
  menu("Bloco de "+T(t).curto,[
    ["bloco-pular",sk?"Desfazer “não consegui”":"Não consegui estudar",attr({key})],
    ["bloco-anotar","Anotar",attr({trilha:tb?tb.trilha:t,livro:tb?tb.id:""})],
    trocado?["bloco-destrocar","Desfazer troca",attr({key})]:["bloco-trocar","Trocar o texto só neste dia",attr({key,trilha:t})],
    (t!=="sintese"||trocado)&&["bloco-inverter","Inverter com outro dia",attr({key})]
  ]);
}
function dialogoTroca(key,t,todas){
  const base=S.livros.filter(b=>b.status!=="concluido"&&!b.extraData),ord=(a,b)=>((ORD_ST[a.status]??3)-(ORD_ST[b.status]??3))||byOrdem(a,b);
  const grupos=(todas?[t,...bookTrilhas().filter(x=>x!==t)]:[t]).map(id=>[id,base.filter(b=>b.trilha===id).sort(ord)]).filter(g=>g[1].length);
  abrirModal('<div class="dialog" role="dialog" aria-labelledby="dt-h"><h2 id="dt-h">Trocar o texto deste dia</h2><p class="small muted">Vale só para este bloco. O plano e os status não mudam.</p>'
    +(grupos.length?grupos.map(([id,l])=>'<div class="group" style="--c:'+T(id).cor+'"><div class="group-h"><strong class="small">'+esc(T(id).nome)+'</strong></div>'+l.map(b=>'<button class="item" style="--c:'+T(id).cor+'" data-act="troca-escolher" data-key="'+key+'" data-id="'+b.id+'"><span class="tt">'+esc(b.titulo)+'</span><span class="sub">'+esc(b.autor||"")+' · '+etapaLabel(b.etapa)+' · '+STATUS[b.status]+'</span></button>').join("")+'</div>').join(""):'<p class="small">Nenhum texto disponível nesta trilha.</p>')
    +'<div class="spread">'+(todas?'<span></span>':'<button class="btn sm ghost" data-act="troca-todas" data-key="'+key+'" data-trilha="'+t+'">Ver textos de outras trilhas</button>')+'<button class="btn ghost" data-act="modal-fechar">Cancelar</button></div></div>');
}
function dialogoInverter(key){
  const bl=blocosDaSemana(),a=bl.find(x=>x.key===key);
  if(!a||!a.atual){toast("Este bloco não tem texto para inverter.");return}
  const outros=bl.filter(x=>x.key!==key&&x.atual);
  abrirModal('<div class="dialog" role="dialog" aria-labelledby="di-h"><h2 id="di-h">Inverter com outro dia</h2><p class="small"><strong>'+a.dia.nome+':</strong> '+esc(a.atual.titulo)+'</p><p class="small muted">Escolha o bloco que troca de lugar com este. Vale só para esta semana.</p>'
    +(outros.length?outros.map(x=>'<button class="item" style="--c:'+T(x.atual.trilha).cor+'" data-act="inverter-escolher" data-a="'+key+'" data-b="'+x.key+'"><span class="tt">'+x.dia.nome+' '+fmtDM(x.date)+' · '+esc(T(x.atual.trilha).curto)+'</span><span class="sub">'+esc(x.atual.titulo)+'</span></button>').join(""):'<p class="small">Não há outro bloco com texto nesta semana.</p>')
    +'<div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="modal-fechar">Cancelar</button></div></div>');
}
function inverterBlocos(ka,kb){
  const bl=blocosDaSemana(),a=bl.find(x=>x.key===ka),b=bl.find(x=>x.key===kb);
  if(!a||!b||!a.atual||!b.atual)return;
  salvarSemana(d=>{d.trocas=d.trocas||{};const por=(blk,bk)=>{if(blk.padrao&&blk.padrao.id===bk.id)delete d.trocas[blk.key];else d.trocas[blk.key]=bk.id};por(a,b.atual);por(b,a.atual)})
    .then(()=>toast(a.dia.nome+" e "+b.dia.nome+" trocaram de texto.")).catch(()=>{});
}

/* ---------- restaurar backup ---------- */
const ID_OK=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
function lerBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result)}catch(e){toast("Esse arquivo não é um backup válido.");return}
    if(!d||d.app!=="caderno-de-estudos"){toast("Esse arquivo não é um backup do caderno.");return}
    S.pendingRestore=d;const n=k=>(d[k]||[]).length;
    abrirModal('<div class="dialog" role="dialog" aria-labelledby="rs-h"><h2 id="rs-h">Restaurar backup</h2><p class="small">Arquivo de '+esc(d.exportadoEm?new Date(d.exportadoEm).toLocaleString("pt-BR"):"data desconhecida")+': '+n("livros")+' textos, '+n("topicos")+' tópicos, '+n("notas")+' fichamentos e sínteses, '+n("conceitos")+' conceitos e '+n("semanas")+' semanas, além do plano.</p>'
      +'<p class="small muted">Itens com o mesmo identificador serão substituídos pelos do arquivo. O que não estiver no arquivo continua no caderno.</p>'
      +'<div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="modal-fechar">Cancelar</button><button class="btn primary" data-act="backup-confirmar">Restaurar</button></div></div>');
  };
  r.onerror=()=>toast("Não consegui ler o arquivo.");r.readAsText(file);
}
async function restaurar(d){
  const ops=[];if(d.config&&typeof d.config==="object")ops.push(["plano/config",d.config]);
  ["livros","topicos","notas","conceitos","semanas","anot","marcas","sessoes","artigos"].forEach(col=>(d[col]||[]).forEach(x=>{if(x&&ID_OK.test(String(x.id)))ops.push([col+"/"+x.id,strip(x)])}));
  let n=0;
  for(const [p,data] of ops){
    try{await comRetentativa(()=>S.db.doc(p).set(data));n++;if(n%15===0)toast("Restaurando… "+n+" de "+ops.length)}
    catch(e){erroDeEscrita(e);toast("Restauração interrompida em "+n+" de "+ops.length+" itens."+(e&&e.message?" Detalhe: "+String(e.message).slice(0,160):""),9000);return}
  }
  toast("Backup restaurado: "+n+" itens.");
}
async function baixar(nome,conteudo){
  if(!S.downloads){toast("Este navegador não permite baixar arquivos daqui.");return false}
  try{await S.downloads.save({filename:nome,data:conteudo});return true}catch(e){if(!e||e.code!=="declined")toast("Não foi possível baixar o arquivo.");return false}
}
async function baixarBackup(){
  const ler=async col=>{try{const q=await S.db.collection(col).get();return q.docs.map(d=>({id:d.id,...d.data()}))}catch(e){return []}};
  const data={app:"caderno-de-estudos",versao:2,exportadoEm:new Date().toISOString(),config:S.cfg||{},livros:S.livros,topicos:S.topicos,notas:S.notas,conceitos:S.conceitos,semanas:await ler("semanas"),anot:await ler("anot"),marcas:await ler("marcas"),sessoes:S.sessoes,artigos:S.artigos};
  if(await baixar("caderno-backup-"+iso(new Date())+".json",JSON.stringify(data,null,2)))toast("Backup baixado.");
